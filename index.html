<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEO CHAT - Secure & Anonymous</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .neo-glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, deleteDoc, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkkQ15xThXoybm7uTbj1-IeHSmzgSA3nw",
      authDomain: "mien-77222.firebaseapp.com",
      projectId: "mien-77222",
      storageBucket: "mien-77222.firebasestorage.app",
      messagingSenderId: "856316713030",
      appId: "1:856316713030:web:9f7d44ecd9a1e1e7df9247",
      measurementId: "G-24V5CVG3YS"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentRoom = "global";
    let myAnonTag = "";
    let unsubsMessages = null;

    // 1. Auth & Mã hóa danh tính ẩn danh
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (!user.emailVerified) {
          showAuthError("⚠️ Hãy vào Gmail bấm Link xác minh kích hoạt tài khoản!");
          await signOut(auth);
          return;
        }
        currentUser = user;
        myAnonTag = "User#" + user.uid.substring(0, 6).toUpperCase();

        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('display-tag').innerText = myAnonTag;
        
        loadMessages(currentRoom);
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    });

    // 2. Đăng ký chỉ chấp nhận đuôi @gmail.com
    document.getElementById('btn-register').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();

      if (!email.endsWith("@gmail.com")) {
        return showAuthError("❌ Hệ thống nghiêm cấm mail rác! Chỉ chấp nhận địa chỉ @gmail.com.");
      }
      if (pass.length < 6) return showAuthError("Mật khẩu phải từ 6 ký tự trở lên.");

      try {
        const res = await createUserWithEmailAndPassword(auth, email, pass);
        await sendEmailVerification(res.user);
        alert("📧 Đã gửi thư xác thực đến Gmail của bạn. Hãy kiểm tra Hộp thư đến hoặc Spam!");
      } catch (err) {
        showAuthError("Lỗi đăng ký: " + err.message);
      }
    });

    // 3. Đăng nhập
    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!email || !pass) return showAuthError("Vui lòng điền đủ thông tin!");

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        showAuthError("Sai tài khoản hoặc mật khẩu.");
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // 4. Gửi tin nhắn siêu tốc (Optimistic UI không có độ trễ)
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const imgInput = document.getElementById('image-input');
      const text = input.value.trim();
      const file = imgInput.files[0];

      if ((!text && !file) || !currentUser) return;

      let imageBase64 = null;
      if (file) {
        if (file.size > 2 * 1024 * 1024) return alert("Ảnh vượt quá 2MB!");
        imageBase64 = await convertBase64(file);
      }

      // Hiển thị tức thì ở client
      const tempId = "tmp-" + Date.now();
      appendMessageUI({
        id: tempId,
        text: text,
        image: imageBase64,
        senderTag: myAnonTag,
        uid: currentUser.uid,
        pending: true
      });

      input.value = '';
      imgInput.value = '';
      document.getElementById('img-preview-box').classList.add('hidden');

      try {
        await addDoc(collection(db, "messages"), {
          room: currentRoom,
          text: text,
          image: imageBase64,
          senderTag: myAnonTag,
          uid: currentUser.uid,
          createdAt: serverTimestamp()
        });
      } catch (err) {
        console.error("Lỗi gửi:", err);
      }
    });

    // 5. Load tin nhắn theo Room
    window.switchRoom = (roomName) => {
      currentRoom = roomName;
      document.getElementById('room-title').innerText = roomName === 'global' ? '# Sảnh Chung' : '# ' + roomName;
      loadMessages(roomName);
    };

    function loadMessages(room) {
      if (unsubsMessages) unsubsMessages();
      const q = query(collection(db, "messages"));
      
      unsubsMessages = onSnapshot(q, (snapshot) => {
        const box = document.getElementById('messages-container');
        box.innerHTML = '';
        let list = [];
        
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if ((data.room || 'global') === room) {
            list.push({ id: docSnap.id, ...data });
          }
        });

        list.sort((a, b) => {
          const t1 = a.createdAt ? a.createdAt.toMillis() : Date.now();
          const t2 = b.createdAt ? b.createdAt.toMillis() : Date.now();
          return t1 - t2;
        });

        if(list.length === 0) {
          box.innerHTML = `<div class="text-center text-slate-500 text-xs py-10">Chưa có tin nhắn nào trong phòng này. Hãy bắt đầu trò chuyện!</div>`;
          return;
        }

        list.forEach(msg => appendMessageUI(msg));
        box.scrollTop = box.scrollHeight;
      });
    }

    function appendMessageUI(msg) {
      const box = document.getElementById('messages-container');
      const isMe = msg.uid === currentUser.uid;
      const old = document.getElementById(msg.id);
      if (old) old.remove();

      const div = document.createElement('div');
      div.id = msg.id;
      div.className = `flex items-start gap-3 group px-4 py-2 hover:bg-slate-800/40 rounded-xl transition ${msg.pending ? 'opacity-50' : ''}`;
      
      div.innerHTML = `
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-white text-xs shadow-lg flex-shrink-0">
          ${msg.senderTag ? msg.senderTag.substring(5, 7) : 'NEO'}
        </div>
        <div class="flex-1 overflow-hidden">
          <div class="flex items-center gap-2">
            <span class="font-bold text-xs text-indigo-400">${msg.senderTag}</span>
            <span class="text-[9px] text-slate-500">${msg.pending ? 'Đang gửi...' : 'Vừa xong'}</span>
          </div>
          ${msg.text ? `<p class="text-sm text-slate-200 mt-1 break-words">${escapeHtml(msg.text)}</p>` : ''}
          ${msg.image ? `<img src="${msg.image}" class="mt-2 max-w-xs rounded-xl border border-slate-700 shadow-xl">` : ''}
        </div>
        ${isMe && !msg.pending ? `
          <button onclick="deleteMessage('${msg.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 p-1 text-xs transition" title="Xóa tin nhắn">
            <i class="fa-solid fa-trash"></i>
          </button>
        ` : ''}
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    window.deleteMessage = async (id) => {
      if (confirm("Xóa tin nhắn này?")) {
        await deleteDoc(doc(db, "messages", id));
      }
    };

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function showAuthError(msg) {
      const el = document.getElementById('auth-error');
      el.innerText = msg;
      el.classList.remove('hidden');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
  
  <!-- PeerJS cho Voice Call -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden select-none">

  <!-- ================= AUTH SCREEN ================= -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
    <div class="neo-glass border border-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-indigo-500/30 mb-3">
          <i class="fa-solid fa-shield-cat"></i>
        </div>
        <h1 class="text-2xl font-extrabold tracking-wide text-white">NEO CHAT</h1>
        <p class="text-xs text-slate-400 mt-1">Bảo mật mã hóa • Chống Mail rác • Voice Tự Do</p>
      </div>

      <div id="auth-error" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3 rounded-xl text-xs mb-4"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Email (@gmail.com)</label>
          <input type="email" id="auth-email" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="name@gmail.com">
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Mật khẩu</label>
          <input type="password" id="auth-password" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="••••••••">
        </div>
        
        <div class="flex gap-3 pt-2">
          <button id="btn-login" class="flex-1 bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">
            Đăng Nhập
          </button>
          <button id="btn-register" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-sm transition">
            Đăng Ký
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= GIAO DIỆN CHÍNH (NEO STYLE) ================= -->
  <div id="app-screen" class="hidden flex-1 flex h-full overflow-hidden">
    
    <!-- Sidebar danh mục -->
    <div class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
      <div>
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
          <span class="font-black text-sm tracking-wider text-indigo-400 flex items-center gap-2">
            <i class="fa-solid fa-bolt"></i> NEO SPACE
          </span>
          <button onclick="createNewGroup()" class="bg-indigo-600/20 hover:bg-indigo-600 text-indigo-400 hover:text-white px-2.5 py-1 rounded-lg text-xs font-bold transition">
            + Tạo Nhóm
          </button>
        </div>

        <div class="p-3 space-y-1">
          <div class="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Kênh Trò Chuyện</div>
          <button onclick="switchRoom('global')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 transition flex items-center gap-2">
            <i class="fa-solid fa-earth-americas text-indigo-400"></i> # Sảnh Chung
          </button>
          <div id="custom-rooms-list" class="space-y-1"></div>
        </div>
      </div>

      <!-- Voice Box Controller -->
      <div class="p-3 border-t border-slate-800 bg-slate-950/50 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Voice Phòng Tự Do
          </span>
          <span id="my-peer-id-badge" class="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded cursor-pointer" onclick="copyMyID()">Copy ID</span>
        </div>
        <div class="flex gap-1">
          <input type="text" id="target-peer-input" placeholder="ID bạn bè..." class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
          <button onclick="callPeer()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-bold transition">Gọi</button>
        </div>
      </div>

      <!-- User Profile Bar -->
      <div class="p-3 border-t border-slate-800 flex items-center justify-between bg-slate-950">
        <div class="flex items-center gap-2 overflow-hidden">
          <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white">N</div>
          <span id="display-tag" class="text-xs font-bold text-slate-200 truncate">User#0000</span>
        </div>
        <button id="btn-logout" class="text-slate-500 hover:text-rose-400 text-xs p-2" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>

    <!-- Main Chat Workspace -->
    <div class="flex-1 flex flex-col bg-slate-950">
      <div class="h-14 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/50">
        <h2 id="room-title" class="font-bold text-sm text-white"># Sảnh Chung</h2>
        <button onclick="shareInvite()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold text-slate-300 transition">
          <i class="fa-solid fa-share-nodes"></i> Chia sẻ phòng
        </button>
      </div>

      <!-- Messages Stream -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-3"></div>

      <!-- Image Preview Indicator -->
      <div id="img-preview-box" class="hidden px-6 py-2 bg-slate-900 border-t border-slate-800 flex items-center justify-between">
        <span class="text-xs text-indigo-400 font-medium"><i class="fa-solid fa-image"></i> Đã đính kèm ảnh</span>
        <button onclick="clearImg()" class="text-rose-400 text-xs hover:underline">Hủy</button>
      </div>

      <!-- Chat Input Form -->
      <div class="p-4 bg-slate-900 border-t border-slate-800">
        <form id="chat-form" class="bg-slate-950 border border-slate-800 rounded-2xl px-4 py-2.5 flex items-center gap-3 shadow-inner">
          <label for="image-input" class="text-slate-400 hover:text-indigo-400 cursor-pointer transition text-lg">
            <i class="fa-solid fa-circle-plus"></i>
          </label>
          <input type="file" id="image-input" accept="image/*" class="hidden" onchange="showImgPreview()">

          <input type="text" id="chat-input" autocomplete="off" placeholder="Nhập tin nhắn..." class="flex-1 bg-transparent text-sm text-white focus:outline-none">

          <!-- Emojis -->
          <button type="button" onclick="insertEmoji('🔥')" class="text-sm">🔥</button>
          <button type="button" onclick="insertEmoji('😂')" class="text-sm">😂</button>
          <button type="button" onclick="insertEmoji('👍')" class="text-sm">👍</button>

          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/20 flex items-center gap-1.5">
            <span>Gửi</span> <i class="fa-solid fa-paper-plane text-[10px]"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Audio element phát voice call -->
  <audio id="remote-audio" autoplay></audio>

  <script>
    // Xử lý Ảnh xem trước
    function showImgPreview() {
      document.getElementById('img-preview-box').classList.remove('hidden');
    }
    function clearImg() {
      document.getElementById('image-input').value = '';
      document.getElementById('img-preview-box').classList.add('hidden');
    }
    function insertEmoji(em) {
      const inp = document.getElementById('chat-input');
      inp.value += em;
      inp.focus();
    }

    // Tạo nhóm mới
    function createNewGroup() {
      const name = prompt("Nhập tên nhóm muốn tạo:");
      if (!name) return;
      const cleanName = name.toLowerCase().replace(/\s+/g, '-');
      
      const list = document.getElementById('custom-rooms-list');
      const btn = document.createElement('button');
      btn.className = "w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800 transition flex items-center justify-between group";
      btn.innerHTML = `<span onclick="switchRoom('${cleanName}')"># ${name}</span> <span class="text-[9px] text-indigo-400">Trưởng nhóm</span>`;
      list.appendChild(btn);
      switchRoom(cleanName);
    }

    function shareInvite() {
      navigator.clipboard.writeText(window.location.href);
      alert("Đã sao chép link mời phòng!");
    }

    // Voice Call PeerJS Tự do ngôn luận
    let peer = new Peer();
    let myPeerID = "";

    peer.on('open', (id) => {
      myPeerID = id;
      const badge = document.getElementById('my-peer-id-badge');
      if(badge) badge.innerText = "ID: " + id.substring(0, 4) + "...";
    });

    peer.on('call', (call) => {
      if (confirm("📞 Có cuộc gọi Voice đến! Bạn có muốn kết nối không?")) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
          call.answer(stream);
          call.on('stream', (remoteStream) => {
            const audio = document.getElementById('remote-audio');
            audio.srcObject = remoteStream;
            audio.play();
          });
        }).catch(() => alert("Không bật được Micro!"));
      }
    });

    function callPeer() {
      const tid = document.getElementById('target-peer-input').value.trim();
      if (!tid) return alert("Vui lòng nhập ID của bạn bè!");

      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
        const call = peer.call(tid, stream);
        call.on('stream', (remoteStream) => {
          const audio = document.getElementById('remote-audio');
          audio.srcObject = remoteStream;
          audio.play();
        });
        alert("Đang gọi kết nối...");
      }).catch(() => alert("Không bật được Micro!"));
    }

    function copyMyID() {
      if(!myPeerID) return;
      navigator.clipboard.writeText(myPeerID);
      alert("Đã sao chép Peer ID của bạn: " + myPeerID);
    }
  </script>
</body>
</html>
