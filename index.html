<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 MIỀN - Trò Chuyện & Kết Nối Riêng Tư</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    * { box-sizing: border-box; }
    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #07090e;
      color: #f1f5f9;
      height: 100%;
      margin: 0;
      overflow: hidden; /* Chống cuộn toàn trang, chỉ cuộn khung chat bên trong */
    }

    /* Thanh cuộn mượt và tinh tế */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    .glass-panel { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.07); }

    /* Hiệu ứng trôi chảy (Fade in & Slide up) cho tin nhắn mới */
    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-animation {
      animation: messageSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Khu vực cuộn tin nhắn mượt trên mobile & PC */
    .chat-messages-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, deleteDoc, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkkQ15xThXoybm7uTbj1-IeHSmzgSA3nw",
      authDomain: "mien-77222.firebaseapp.com",
      projectId: "mien-77222",
      storageBucket: "mien-77222.firebasestorage.app",
      messagingSenderId: "856316713030",
      appId: "1:856316713030:web:9f7d44ecd9a1e1e7df9247",
      measurementId: "G-24V5CVG3YS"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentRoom = "mien-bac-chung";
    let myAnonTag = "";
    let unsubsMessages = null;

    // Kiểm tra trạng thái tài khoản & hình phạt
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (!user.emailVerified) {
          showAuthError("⚠️ Hãy vào hộp thư Gmail bấm link xác minh để kích hoạt tài khoản 3 Miền!");
          await signOut(auth);
          return;
        }
        currentUser = user;
        myAnonTag = "User#" + user.uid.substring(0, 6).toUpperCase();

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) {
          await setDoc(userRef, { email: user.email, tag: myAnonTag, restricted: false, reportsCount: 0 });
        } else {
          const uData = userSnap.data();
          if (uData.restricted) {
            alert("❌ Tài khoản của bạn đã bị HẠN CHẾ do vi phạm tiêu chuẩn cộng đồng. Bạn không thể gửi tin nhắn hoặc gọi thoại!");
          }
        }

        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('display-tag').innerText = myAnonTag;
        
        loadMessages(currentRoom);
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    });

    // Đăng ký
    document.getElementById('btn-register').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();

      if (!email.endsWith("@gmail.com")) {
        return showAuthError("❌ Hệ thống 3 Miền nghiêm cấm mail rác! Chỉ chấp nhận đuôi @gmail.com.");
      }
      if (pass.length < 6) return showAuthError("Mật khẩu bảo mật phải từ 6 ký tự trở lên.");

      try {
        const res = await createUserWithEmailAndPassword(auth, email, pass);
        await sendEmailVerification(res.user);
        alert("📧 Đã gửi thư xác thực đến Gmail của bạn. Hãy kiểm tra Hộp thư đến hoặc Thư rác (Spam)!");
      } catch (err) {
        showAuthError("Lỗi đăng ký: " + err.message);
      }
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!email || !pass) return showAuthError("Vui lòng điền đầy đủ thông tin!");

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        showAuthError("Sai tài khoản hoặc mật khẩu đăng nhập.");
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    // Gửi tin nhắn
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const userRef = doc(db, "users", currentUser.uid);
      const userSnap = await getDoc(userRef);
      if (userSnap.exists() && userSnap.data().restricted) {
        return alert("❌ Tài khoản của bạn đang bị hạn chế vì vi phạm nội quy! Không thể gửi tin nhắn.");
      }

      const input = document.getElementById('chat-input');
      const imgInput = document.getElementById('image-input');
      const text = input.value.trim();
      const file = imgInput.files[0];

      if (!text && !file) return;

      let imageBase64 = null;
      if (file) {
        if (file.size > 2 * 1024 * 1024) return alert("Ảnh dung lượng quá lớn (>2MB)! Vui lòng chọn ảnh nhỏ hơn.");
        imageBase64 = await convertBase64(file);
      }

      // Kiểm tra từ khóa thô tục
      const badWords = ["dcm", "địt", "lồn", "cặc", "đụ", "dm", "vl", "cc"];
      const hasBadWord = badWords.some(w => text.toLowerCase().includes(w));
      if (hasBadWord && userSnap.exists()) {
        const currentReports = userSnap.data().reportsCount || 0;
        if (currentReports >= 2) {
          await updateDoc(userRef, { restricted: true });
          alert("🚨 Tài khoản của bạn đã bị KHÓA QUYỀN CHAT do sử dụng ngôn từ xúc phạm nhiều lần!");
          return;
        } else {
          await updateDoc(userRef, { reportsCount: currentReports + 1 });
          alert("⚠️ Cảnh cáo: Bạn đang dùng ngôn từ xúc phạm! Tái phạm sẽ bị khóa tính năng.");
        }
      }

      input.value = '';
      imgInput.value = '';
      document.getElementById('img-preview-box').classList.add('hidden');

      try {
        await addDoc(collection(db, "messages"), {
          room: currentRoom,
          text: text,
          image: imageBase64,
          senderTag: myAnonTag,
          uid: currentUser.uid,
          createdAt: serverTimestamp()
        });
      } catch (err) {
        console.error("Lỗi gửi:", err);
      }
    });

    // Chuyển phòng
    window.switchRoom = (roomName, roomTitle) => {
      currentRoom = roomName;
      document.getElementById('room-title').innerText = roomTitle || ("# " + roomName);
      loadMessages(roomName);
      document.getElementById('sidebar').classList.add('-translate-x-full');
    };

    function loadMessages(room) {
      if (unsubsMessages) unsubsMessages();
      const q = query(collection(db, "messages"));
      
      unsubsMessages = onSnapshot(q, (snapshot) => {
        const box = document.getElementById('messages-container');
        box.innerHTML = '';
        let list = [];
        
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if ((data.room || 'mien-bac-chung') === room) {
            list.push({ id: docSnap.id, ...data });
          }
        });

        list.sort((a, b) => {
          const t1 = a.createdAt ? a.createdAt.toMillis() : Date.now();
          const t2 = b.createdAt ? b.createdAt.toMillis() : Date.now();
          return t1 - t2;
        });

        if(list.length === 0) {
          box.innerHTML = `<div class="text-center text-slate-500 text-xs py-16">Phòng riêng tư này chưa có tin nhắn nào. Hãy bắt đầu trò chuyện!</div>`;
          return;
        }

        list.forEach(msg => appendMessageUI(msg));
        box.scrollTop = box.scrollHeight;
      });
    }

    function appendMessageUI(msg) {
      const box = document.getElementById('messages-container');
      const isMe = msg.uid === currentUser.uid;

      const div = document.createElement('div');
      div.className = `flex items-start gap-3 group px-4 py-2.5 hover:bg-slate-900/40 rounded-xl transition message-animation`;
      
      div.innerHTML = `
        <div onclick="openUserProfile('${msg.uid}', '${msg.senderTag}')" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white text-xs shadow-md cursor-pointer hover:scale-105 transition flex-shrink-0" title="Xem Profile & Kết bạn">
          ${msg.senderTag ? msg.senderTag.substring(5, 7) : '3M'}
        </div>
        <div class="flex-1 overflow-hidden">
          <div class="flex items-center gap-2">
            <span onclick="openUserProfile('${msg.uid}', '${msg.senderTag}')" class="font-bold text-xs text-blue-400 cursor-pointer hover:underline">${msg.senderTag}</span>
            <span class="text-[9px] text-slate-500">Gần đây</span>
          </div>
          ${msg.text ? `<p class="text-sm text-slate-200 mt-1 break-words leading-relaxed">${escapeHtml(msg.text)}</p>` : ''}
          ${msg.image ? `<img src="${msg.image}" class="mt-2 max-w-xs rounded-xl border border-slate-800 shadow-xl transition hover:scale-[1.01]">` : ''}
        </div>
        ${isMe ? `
          <button onclick="deleteMessage('${msg.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 p-1 text-xs transition" title="Xóa tin nhắn">
            <i class="fa-solid fa-trash"></i>
          </button>
        ` : ''}
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    window.deleteMessage = async (id) => {
      if (confirm("Bạn có chắc muốn xóa tin nhắn này?")) {
        await deleteDoc(doc(db, "messages", id));
      }
    };

    window.openUserProfile = (uid, tag) => {
      document.getElementById('modal-username').innerText = tag;
      document.getElementById('modal-uid-val').innerText = uid;
      document.getElementById('profile-modal').classList.remove('hidden');
    };

    window.closeModal = () => {
      document.getElementById('profile-modal').classList.add('hidden');
    };

    window.sendFriendRequest = () => {
      alert("✅ Đã gửi lời mời kết bạn thành công!");
      closeModal();
    };

    window.reportUserModal = async () => {
      const reason = prompt("Nhập lý do báo cáo (Xúc phạm, 18+, Lừa đảo...):");
      if (!reason) return;

      const targetUid = document.getElementById('modal-uid-val').innerText;
      try {
        const targetRef = doc(db, "users", targetUid);
        const tSnap = await getDoc(targetRef);
        if (tSnap.exists()) {
          const currentRep = tSnap.data().reportsCount || 0;
          if (currentRep >= 1) {
            await updateDoc(targetRef, { restricted: true, reportsCount: currentRep + 1 });
            alert("🚨 Hệ thống đã ghi nhận và KHÓA/HẠN CHẾ tài khoản vi phạm này do có nhiều báo cáo!");
          } else {
            await updateDoc(targetRef, { reportsCount: currentRep + 1 });
            alert("⚠️ Đã gửi báo cáo thành công đến hệ thống kiểm duyệt 3 Miền.");
          }
        }
      } catch (err) {
        alert("Lỗi báo cáo: " + err.message);
      }
      closeModal();
    };

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function showAuthError(msg) {
      const el = document.getElementById('auth-error');
      el.innerText = msg;
      el.classList.remove('hidden');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
  
  <!-- PeerJS cho Voice Call Riêng Tư -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="h-[100dvh] flex flex-col select-none">

  <!-- ================= AUTH SCREEN ================= -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#07090e] p-4">
    <div class="glass-panel p-8 rounded-3xl w-full max-w-md shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-blue-500/20 mb-3">
          <i class="fa-solid fa-mountain-sun"></i>
        </div>
        <h1 class="text-3xl font-black tracking-wider text-white">3 MIỀN</h1>
        <p class="text-xs text-slate-400 mt-1">Hệ thống Trò chuyện & Gọi thoại Riêng Tư • Chống Mail Rác</p>
      </div>

      <div id="auth-error" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3 rounded-xl text-xs mb-4"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Email (@gmail.com)</label>
          <input type="email" id="auth-email" required class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="name@gmail.com">
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Mật khẩu bảo mật</label>
          <input type="password" id="auth-password" required class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
        </div>
        
        <div class="flex gap-3 pt-2">
          <button id="btn-login" class="flex-1 bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/20">
            Đăng Nhập
          </button>
          <button id="btn-register" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-sm transition">
            Đăng Ký
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= GIAO DIỆN CHÍNH ================= -->
  <div id="app-screen" class="hidden flex-1 flex h-full overflow-hidden relative">
    
    <!-- Mobile Menu Toggle Button -->
    <button onclick="toggleSidebar()" class="md:hidden absolute top-3 left-3 z-30 bg-slate-800 text-white p-2 rounded-xl text-xs shadow">
      <i class="fa-solid fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <div id="sidebar" class="absolute md:relative inset-y-0 left-0 z-20 w-72 bg-[#0b0f19] border-r border-slate-800/80 flex flex-col justify-between transform -translate-x-full md:translate-x-0 transition duration-300 shadow-2xl md:shadow-none">
      <div>
        <div class="p-4 border-b border-slate-800/80 flex items-center justify-between">
          <span class="font-black text-sm tracking-widest text-blue-400 flex items-center gap-2">
            <i class="fa-solid fa-mountain-sun"></i> 3 MIỀN CHAT
          </span>
          <button onclick="createNewPrivateGroup()" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-2.5 py-1 rounded-lg text-xs font-bold transition">
            + Tạo Nhóm
          </button>
        </div>

        <div class="p-3 space-y-1.5 overflow-y-auto max-h-[calc(100vh-200px)]">
          <div class="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Khu vực Miền</div>
          <button onclick="switchRoom('mien-bac-chung', '# 🏔️ Miền Bắc - Sảnh Chung')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center gap-2">
            <i class="fa-solid fa-snowflake text-cyan-400"></i> Miền Bắc
          </button>
          <button onclick="switchRoom('mien-trung-chung', '# 🏖️ Miền Trung - Sảnh Chung')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center gap-2">
            <i class="fa-solid fa-sun text-amber-400"></i> Miền Trung
          </button>
          <button onclick="switchRoom('mien-nam-chung', '# 🌴 Miền Nam - Sảnh Chung')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center gap-2">
            <i class="fa-solid fa-water text-emerald-400"></i> Miền Nam
          </button>

          <div class="pt-3 text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Nhóm Riêng Tư (Private)</div>
          <div id="custom-groups-list" class="space-y-1"></div>
        </div>
      </div>

      <!-- Voice Call Controller -->
      <div class="p-3 border-t border-slate-800/80 bg-[#07090e] space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Voice/Call Riêng Tư
          </span>
          <span id="my-peer-id-badge" class="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded cursor-pointer hover:bg-slate-700" onclick="copyMyID()" title="Bấm để copy ID gọi">Copy ID</span>
        </div>
        <div class="flex gap-1">
          <input type="text" id="target-peer-input" placeholder="Dán ID bạn bè..." class="flex-1 bg-[#0b0f19] border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
          <button onclick="callPeer()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">Gọi</button>
        </div>
      </div>

      <!-- User Profile Bar -->
      <div class="p-3 border-t border-slate-800/80 flex items-center justify-between bg-[#05070a]">
        <div class="flex items-center gap-2 overflow-hidden">
          <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-xs text-white shadow">3M</div>
          <span id="display-tag" class="text-xs font-bold text-slate-200 truncate">User#0000</span>
        </div>
        <button id="btn-logout" class="text-slate-500 hover:text-rose-400 text-xs p-2 transition" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>

    <!-- Main Chat Workspace -->
    <div class="flex-1 flex flex-col bg-[#07090e] h-full overflow-hidden">
      <div class="h-14 border-b border-slate-800/80 px-4 md:px-6 flex items-center justify-between bg-[#0b0f19]/60 backdrop-blur flex-shrink-0">
        <h2 id="room-title" class="font-bold text-sm text-white pl-8 md:pl-0"># 🏔️ Miền Bắc - Sảnh Chung</h2>
        <button onclick="sharePrivateInvite()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold text-slate-300 transition flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-shield-halved"></i> Chia sẻ phòng
        </button>
      </div>

      <!-- Khung chứa tin nhắn đã tối ưu lướt mượt mà -->
      <div id="messages-container" class="flex-1 chat-messages-scroll p-4 md:p-6 space-y-3"></div>

      <!-- Image Preview Box -->
      <div id="img-preview-box" class="hidden px-6 py-2 bg-[#0b0f19] border-t border-slate-800 flex items-center justify-between flex-shrink-0">
        <span class="text-xs text-blue-400 font-medium"><i class="fa-solid fa-image"></i> Đã đính kèm ảnh</span>
        <button onclick="clearImg()" class="text-rose-400 text-xs hover:underline">Hủy ảnh</button>
      </div>

      <!-- Chat Input Form -->
      <div class="p-3 md:p-4 bg-[#0b0f19] border-t border-slate-800/80 flex-shrink-0">
        <form id="chat-form" class="bg-[#07090e] border border-slate-800 rounded-2xl px-4 py-2.5 flex items-center gap-3 shadow-inner">
          <label for="image-input" class="text-slate-400 hover:text-blue-400 cursor-pointer transition text-lg" title="Gửi hình ảnh">
            <i class="fa-solid fa-circle-plus"></i>
          </label>
          <input type="file" id="image-input" accept="image/*" class="hidden" onchange="showImgPreview()">

          <input type="text" id="chat-input" autocomplete="off" placeholder="Nhập tin nhắn bảo mật..." class="flex-1 bg-transparent text-sm text-white focus:outline-none">

          <!-- Emojis -->
          <button type="button" onclick="insertEmoji('🔥')" class="text-sm hover:scale-110 transition">🔥</button>
          <button type="button" onclick="insertEmoji('😂')" class="text-sm hover:scale-110 transition">😂</button>
          <button type="button" onclick="insertEmoji('👍')" class="text-sm hover:scale-110 transition">👍</button>

          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-blue-600/20 flex items-center gap-1.5">
            <span>Gửi</span> <i class="fa-solid fa-paper-plane text-[10px]"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= MODAL PROFILE ================= -->
  <div id="profile-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="glass-panel p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 mx-auto flex items-center justify-center text-white text-xl font-black shadow-lg mb-3">3M</div>
      <h3 id="modal-username" class="text-lg font-bold text-white">User#0000</h3>
      <p id="modal-uid-val" class="text-[10px] text-slate-500 mt-0.5 truncate"></p>
      
      <div class="mt-6 space-y-2.5">
        <button onclick="sendFriendRequest()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">
          <i class="fa-solid fa-user-plus"></i> Kết bạn
        </button>
        <button onclick="reportUserModal()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 font-bold py-2.5 rounded-xl text-xs transition">
          <i class="fa-solid fa-triangle-exclamation"></i> Báo cáo vi phạm (18+ / Xúc phạm)
        </button>
      </div>
    </div>
  </div>

  <!-- Audio element phát voice call -->
  <audio id="remote-audio" autoplay></audio>

  <script>
    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('-translate-x-full');
    }

    function showImgPreview() {
      document.getElementById('img-preview-box').classList.remove('hidden');
    }
    function clearImg() {
      document.getElementById('image-input').value = '';
      document.getElementById('img-preview-box').classList.add('hidden');
    }
    function insertEmoji(em) {
      const inp = document.getElementById('chat-input');
      inp.value += em;
      inp.focus();
    }

    function createNewPrivateGroup() {
      const name = prompt("Nhập tên nhóm riêng tư muốn tạo:");
      if (!name) return;
      const cleanName = "nhom-" + name.toLowerCase().replace(/\s+/g, '-') + "-" + Math.floor(Math.random() * 1000);
      
      const list = document.getElementById('custom-groups-list');
      const btn = document.createElement('button');
      btn.className = "w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center justify-between";
      btn.innerHTML = `<span onclick="switchRoom('${cleanName}', '# 🔒 Nhóm: ${name}')"># ${name}</span> <span class="text-[9px] text-emerald-400">Riêng tư</span>`;
      list.appendChild(btn);
      switchRoom(cleanName, '# 🔒 Nhóm: ' + name);
    }

    function sharePrivateInvite() {
      navigator.clipboard.writeText(window.location.href);
      alert("Đã sao chép liên kết phòng riêng tư!");
    }

    // PeerJS Voice Call
    let peer = new Peer();
    let myPeerID = "";

    peer.on('open', (id) => {
      myPeerID = id;
      const badge = document.getElementById('my-peer-id-badge');
      if(badge) badge.innerText = "ID: " + id.substring(0, 4) + "...";
    });

    peer.on('call', (call) => {
      if (confirm("📞 Có cuộc gọi thoại riêng tư đến! Bạn có muốn chấp nhận không?")) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
          call.answer(stream);
          call.on('stream', (remoteStream) => {
            const audio = document.getElementById('remote-audio');
            audio.srcObject = remoteStream;
            audio.play();
          });
        }).catch(() => alert("Không thể truy cập Micro của thiết bị!"));
      }
    });

    function callPeer() {
      const tid = document.getElementById('target-peer-input').value.trim();
      if (!tid) return alert("Vui lòng nhập hoặc dán ID của bạn bè để gọi!");

      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
        const call = peer.call(tid, stream);
        call.on('stream', (remoteStream) => {
          const audio = document.getElementById('remote-audio');
          audio.srcObject = remoteStream;
          audio.play();
        });
        alert("Đang kết nối cuộc gọi thoại riêng tư...");
      }).catch(() => alert("Không thể truy cập Micro để gọi!"));
    }

    function copyMyID() {
      if(!myPeerID) return;
      navigator.clipboard.writeText(myPeerID);
      alert("Đã sao chép ID thoại của bạn: " + myPeerID);
    }
  </script>
</body>
</html>
