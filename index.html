<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANON CHAT - Full Application</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Firebase SDK JS (Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config đã tích hợp chìa khóa của bạn
    const firebaseConfig = {
      apiKey: "AIzaSyCkkQ15xThXoybm7uTbj1-IeHSmzgSA3nw",
      authDomain: "mien-77222.firebaseapp.com",
      projectId: "mien-77222",
      storageBucket: "mien-77222.firebasestorage.app",
      messagingSenderId: "856316713030",
      appId: "1:856316713030:web:9f7d44ecd9a1e1e7df9247",
      measurementId: "G-24V5CVG3YS"
    };

    // Khởi tạo Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let unsubscribeMessages = null;

    // 1. Kiểm tra trạng thái xác minh Email & Đăng nhập
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (!user.emailVerified) {
          showAuthError("⚠️ Tài khoản chưa kích hoạt! Vui lòng vào Hòm thư (Spam/Hộp thư đến) bấm vào Link xác minh rồi Đăng nhập lại.");
          await signOut(auth);
          return;
        }
        currentUser = user;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-email-display').innerText = user.email;
        loadRealtimeMessages();
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    });

    // 2. Đăng ký tài khoản + Gửi mail xác minh thật
    document.getElementById('btn-register').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!email || !pass) return showAuthError("Vui lòng điền đầy đủ Email và Mật khẩu!");

      try {
        const res = await createUserWithEmailAndPassword(auth, email, pass);
        await sendEmailVerification(res.user);
        alert("📧 Đã gửi Email xác minh! Hãy kiểm tra Hòm thư (hoặc thư mục Spam) và bấm vào Link kích hoạt.");
      } catch (err) {
        showAuthError("Lỗi đăng ký: " + err.message);
      }
    });

    // 3. Đăng nhập
    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!email || !pass) return showAuthError("Vui lòng điền đầy đủ Email và Mật khẩu!");

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        showAuthError("Email hoặc Mật khẩu không chính xác.");
      }
    });

    // 4. Đăng xuất
    document.getElementById('btn-logout').addEventListener('click', () => {
      if (unsubscribeMessages) unsubscribeMessages();
      signOut(auth);
    });

    // 5. Gửi tin nhắn lên Firestore
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      try {
        await addDoc(collection(db, "messages"), {
          text: text,
          senderEmail: currentUser.email,
          uid: currentUser.uid,
          createdAt: serverTimestamp()
        });
        input.value = '';
      } catch (err) {
        alert("Lỗi gửi tin nhắn! Hãy chắc chắn bạn đã bật Firestore Database trên Firebase Console.");
      }
    });

    // 6. Lắng nghe tin nhắn Realtime (Đã tối ưu không bị lỗi Index)
    function loadRealtimeMessages() {
      const q = query(collection(db, "messages"));
      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const box = document.getElementById('messages-box');
        box.innerHTML = '';

        let messages = [];
        snapshot.forEach((doc) => {
          messages.push({ id: doc.id, ...doc.data() });
        });

        // Sắp xếp thời gian tại Client để tránh cần cài đặt Index phức tạp
        messages.sort((a, b) => {
          const t1 = a.createdAt ? a.createdAt.toMillis() : Date.now();
          const t2 = b.createdAt ? b.createdAt.toMillis() : Date.now();
          return t1 - t2;
        });

        if (messages.length === 0) {
          box.innerHTML = '<div class="text-center text-xs text-slate-500 py-4">Chưa có tin nhắn nào. Hãy bắt đầu cuộc trò chuyện!</div>';
          return;
        }

        messages.forEach((msg) => {
          const isMe = msg.uid === currentUser.uid;
          const div = document.createElement('div');
          div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
          div.innerHTML = `
            <span class="text-[10px] text-slate-500 mb-0.5 px-1">${msg.senderEmail ? msg.senderEmail.split('@')[0] : 'Anon'}</span>
            <div class="${isMe ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-800 text-slate-200 rounded-tl-none'} px-4 py-2.5 rounded-2xl text-sm max-w-xs md:max-w-md shadow-md break-words">
              ${escapeHtml(msg.text)}
            </div>
          `;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      }, (error) => {
        console.error("Lỗi Realtime:", error);
      });
    }

    function showAuthError(text) {
      const errEl = document.getElementById('auth-error');
      errEl.innerText = text;
      errEl.classList.remove('hidden');
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
  
  <!-- PeerJS cho Voice Call WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- ================= MÀN HÌNH ĐĂNG KÝ / ĐĂNG NHẬP ================= -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-black text-indigo-500 tracking-wider">ANON CHAT</h1>
        <p class="text-xs text-slate-400 mt-1">Xác minh Email thật • Realtime & Voice Call</p>
      </div>

      <div id="auth-error" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3 rounded-xl text-xs mb-4"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Email</label>
          <input type="email" id="auth-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="user@gmail.com">
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Mật khẩu</label>
          <input type="password" id="auth-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="••••••••">
        </div>
        
        <div class="flex gap-3 pt-2">
          <button id="btn-login" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition">
            Đăng Nhập
          </button>
          <button id="btn-register" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-sm transition">
            Đăng Ký
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= GIAO DIỆN CHÍNH CỦA APP ================= -->
  <div id="app-screen" class="hidden flex-1 flex h-full">
    <!-- Sidebar -->
    <div class="w-72 md:w-80 bg-slate-950 border-r border-slate-800 flex flex-col justify-between">
      <div>
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-2 overflow-hidden">
            <div class="w-3 h-3 rounded-full bg-emerald-500 flex-shrink-0 animate-pulse"></div>
            <span id="user-email-display" class="font-bold text-xs truncate text-indigo-400"></span>
          </div>
          <button id="btn-logout" title="Đăng xuất" class="text-slate-500 hover:text-rose-400 text-xs pl-2"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>

        <div class="p-3 space-y-3">
          <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Kênh Chat Công Khai</div>
          <div class="p-3 bg-indigo-600/10 border border-indigo-500/20 rounded-xl text-xs text-indigo-300 font-bold flex items-center justify-between">
            <span class="flex items-center gap-2"><i class="fa-solid fa-hashtag text-indigo-400"></i> Global-Chat</span>
            <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
          </div>
        </div>
      </div>

      <!-- Voice Call Module -->
      <div class="p-4 border-t border-slate-800 space-y-3 bg-slate-950/50">
        <div class="flex items-center justify-between">
          <div class="text-xs font-bold text-slate-400">Voice Call Trực Tiếp</div>
          <span id="my-peer-id" class="text-[9px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded cursor-pointer" title="Click để sao chép Peer ID" onclick="copyPeerID()">ID: ...</span>
        </div>
        <input type="text" id="peer-id-input" placeholder="Dán Peer ID đối phương..." class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        <button onclick="startVoiceCall()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-phone"></i> Bắt đầu Voice Call
        </button>
      </div>
    </div>

    <!-- Main Chat Container -->
    <div class="flex-1 flex flex-col bg-slate-900">
      <div class="h-14 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-950">
        <h2 class="font-bold text-sm text-white flex items-center gap-2">
          <i class="fa-solid fa-comments text-indigo-500"></i> Sảnh Trò Chuyện Realtime
        </h2>
      </div>

      <!-- Messages Box -->
      <div id="messages-box" class="flex-1 overflow-y-auto p-6 space-y-4">
        <!-- Tin nhắn Render tại đây -->
      </div>

      <!-- Input Bar -->
      <div class="p-4 border-t border-slate-800 bg-slate-950">
        <form id="chat-form" class="flex gap-2">
          <input type="text" id="chat-input" autocomplete="off" placeholder="Nhập tin nhắn..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-3 rounded-xl text-sm transition flex items-center gap-2">
            <span>Gửi</span>
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // PeerJS Voice Call
    let peer = new Peer();
    let currentPeerID = "";

    peer.on('open', (id) => {
      currentPeerID = id;
      const el = document.getElementById('my-peer-id');
      if (el) el.innerText = "ID: " + id.substring(0, 6) + "...";
    });

    peer.on('call', (call) => {
      if (confirm("📞 Có cuộc gọi Voice đến! Bạn có muốn nghe không?")) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
          call.answer(stream);
          call.on('stream', (remoteStream) => {
            const audio = new Audio();
            audio.srcObject = remoteStream;
            audio.play();
          });
        }).catch(() => alert("Không thể truy cập Micro của bạn!"));
      }
    });

    function startVoiceCall() {
      const targetId = document.getElementById('peer-id-input').value.trim();
      if (!targetId) return alert("Vui lòng nhập ID người nhận!");
      
      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
        const call = peer.call(targetId, stream);
        call.on('stream', (remoteStream) => {
          const audio = new Audio();
          audio.srcObject = remoteStream;
          audio.play();
        });
      }).catch(() => alert("Không thể truy cập Micro của bạn!"));
    }

    function copyPeerID() {
      if (!currentPeerID) return;
      navigator.clipboard.writeText(currentPeerID);
      alert("Đã sao chép Peer ID của bạn: " + currentPeerID);
    }
  </script>
</body>
</html>
