<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 MIỀN - Ultimate Chat & Voice Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    * { box-sizing: border-box; }
    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #05070a;
      color: #f1f5f9;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

    .glass-panel { background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }

    .chat-messages-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    /* Đèn trạng thái VIP theo tim */
    .badge-vip-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
    .badge-vip-diamond { background: linear-gradient(135deg, #06b6d4, #3b82f6); color: #fff; }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, deleteDoc, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkkQ15xThXoybm7uTbj1-IeHSmzgSA3nw",
      authDomain: "mien-77222.firebaseapp.com",
      projectId: "mien-77222",
      storageBucket: "mien-77222.firebasestorage.app",
      messagingSenderId: "856316713030",
      appId: "1:856316713030:web:9f7d44ecd9a1e1e7df9247"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence);
    const db = getFirestore(app);

    let currentUser = null;
    let currentRoom = "mien-bac-chung";
    let myAnonTag = "";
    let myDisplayName = "";
    let myAvatar = "";
    let myHearts = 0;
    let myCreatedAt = "";
    let unsubsMessages = null;
    let lastMessageContent = "";
    let spamCount = 0;
    let selectedImageBase64 = "";

    function showAuthError(msg) {
      const errBox = document.getElementById('auth-error');
      errBox.innerText = msg;
      errBox.classList.remove('hidden');
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (!user.emailVerified) {
          showAuthError("⚠️ Tài khoản chưa xác minh Gmail. Vui lòng bấm link trong Gmail của bạn!");
          document.getElementById('resend-box').classList.remove('hidden');
          await signOut(auth);
          return;
        }
        currentUser = user;
        myAnonTag = "User#" + user.uid.substring(0, 6).toUpperCase();
        myCreatedAt = user.metadata.creationTime ? new Date(user.metadata.creationTime).toLocaleDateString('vi-VN') : "Mới đây";

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) {
          myDisplayName = myAnonTag;
          myAvatar = "";
          myHearts = 0;
          await setDoc(userRef, { email: user.email, tag: myAnonTag, displayName: myDisplayName, avatar: myAvatar, hearts: 0, createdAt: myCreatedAt, restricted: false });
        } else {
          const data = userSnap.data();
          myDisplayName = data.displayName || myAnonTag;
          myAvatar = data.avatar || "";
          myHearts = data.hearts || 0;
          if (data.restricted) {
            alert("❌ Tài khoản này đã bị hạn chế tương tác do nhiều vi phạm!");
          }
        }

        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        updateMyProfileUI();
        loadMessages(currentRoom);
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    });

    window.registerUser = async () => {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!email.endsWith("@gmail.com")) return showAuthError("❌ Email phải dùng đuôi @gmail.com!");
      if (pass.length < 6) return showAuthError("Mật khẩu phải từ 6 ký tự trở lên.");

      try {
        const res = await createUserWithEmailAndPassword(auth, email, pass);
        await sendEmailVerification(res.user);
        alert("📧 Đã gửi thư xác nhận. Vui lòng kiểm tra Hộp thư hoặc Thư rác (Spam) trong Gmail!");
        document.getElementById('resend-box').classList.remove('hidden');
      } catch (err) {
        showAuthError("Lỗi đăng ký: " + err.message);
      }
    };

    window.loginUser = async () => {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!email || !pass) return showAuthError("Vui lòng điền đầy đủ email và mật khẩu!");
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        showAuthError("Tài khoản hoặc mật khẩu không chính xác.");
      }
    };

    window.resendVerificationEmail = async () => {
      try {
        if (auth.currentUser) {
          await sendEmailVerification(auth.currentUser);
          alert("📨 Đã gửi lại thư xác minh!");
        } else {
          alert("Vui lòng thử đăng nhập lại để hệ thống gửi lại email.");
        }
      } catch(e) {
        alert("Thao tác quá nhanh, thử lại sau ít phút.");
      }
    };

    window.logoutUser = () => signOut(auth);

    // Xử lý đính kèm ảnh tin nhắn
    window.handleImageAttach = (input) => {
      const file = input.files[0];
      if (file) {
        if (file.size > 2 * 1024 * 1024) return alert("Kích thước ảnh phải nhỏ hơn 2MB!");
        const reader = new FileReader();
        reader.onload = (e) => {
          selectedImageBase64 = e.target.result;
          document.getElementById('image-preview-container').classList.remove('hidden');
          document.getElementById('image-preview').src = selectedImageBase64;
        };
        reader.readAsDataURL(file);
      }
    };

    window.removeAttachedImage = () => {
      selectedImageBase64 = "";
      document.getElementById('image-preview-container').classList.add('hidden');
      document.getElementById('file-input').value = "";
    };

    // Gửi tin nhắn
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const userRef = doc(db, "users", currentUser.uid);
      const userSnap = await getDoc(userRef);
      if (userSnap.exists() && userSnap.data().restricted) {
        return alert("❌ Tài khoản của bạn bị tạm khóa quyền gửi tin nhắn!");
      }

      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text && !selectedImageBase64) return;

      if (text === lastMessageContent && text !== "") {
        spamCount++;
        if (spamCount >= 4) {
          await updateDoc(userRef, { restricted: true });
          alert("🚨 Phát hiện gửi tin nhắn lặp lại liên tục! Tài khoản bị tạm khóa.");
          return;
        }
      } else {
        spamCount = 0;
        lastMessageContent = text;
      }

      const sendText = text;
      const sendImg = selectedImageBase64;
      
      input.value = '';
      removeAttachedImage();

      if (sendText.startsWith("@ai ") || currentRoom.includes("ai-")) {
        const promptText = sendText.replace("@ai", "").trim();
        await addDoc(collection(db, "messages"), {
          room: currentRoom, text: sendText, image: sendImg, senderTag: myDisplayName, uid: currentUser.uid, avatar: myAvatar, createdAt: serverTimestamp()
        });

        setTimeout(async () => {
          const botReply = generateAIBotResponse(promptText);
          await addDoc(collection(db, "messages"), {
            room: currentRoom, text: "🤖 [AI 3 Miền]: " + botReply, image: "", senderTag: "AI Trợ Lý", uid: "bot-ai-system", avatar: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png", createdAt: serverTimestamp()
          });
        }, 500);
        return;
      }

      try {
        await addDoc(collection(db, "messages"), {
          room: currentRoom,
          text: sendText,
          image: sendImg,
          senderTag: myDisplayName,
          uid: currentUser.uid,
          avatar: myAvatar,
          createdAt: serverTimestamp()
        });
      } catch (err) {
        console.error("Lỗi gửi:", err);
      }
    });

    function generateAIBotResponse(query) {
      const q = query.toLowerCase();
      if (q.includes("hack") || q.includes("phá hoại") || q.includes("tấn công")) {
        return "Mấy trò hack hay phá hoại là mình xin phép từ chối ngay nha! Trò chuyện vui vẻ lành mạnh thôi nè ✨";
      }
      if (q.includes("chào") || q.includes("hi") || q.includes("hello")) {
        return "Chào bạn nè! Hôm nay của bạn thế nào? Cần mình trợ giúp gì không? 💙";
      }
      return `Câu hỏi "${query}" rất hay! Cứ thoải mái kết nối và trò chuyện cùng mọi người tại 3 Miền nhé! 😎`;
    }

    window.switchRoom = (roomName, roomTitle) => {
      currentRoom = roomName;
      document.getElementById('room-title').innerText = roomTitle || ("# " + roomName);
      loadMessages(roomName);
    };

    // Load tin nhắn chống nhảy giật Scroll
    function loadMessages(room) {
      if (unsubsMessages) unsubsMessages();
      const q = query(collection(db, "messages"));
      
      unsubsMessages = onSnapshot(q, (snapshot) => {
        const box = document.getElementById('messages-container');
        // Kiểm tra xem user có đang ở sát đáy chat không
        const isAtBottom = box.scrollHeight - box.clientHeight - box.scrollTop < 120;

        box.innerHTML = '';
        let list = [];
        
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if ((data.room || 'mien-bac-chung') === room) {
            list.push({ id: docSnap.id, ...data });
          }
        });

        list.sort((a, b) => {
          const t1 = a.createdAt ? a.createdAt.toMillis() : Date.now();
          const t2 = b.createdAt ? b.createdAt.toMillis() : Date.now();
          return t1 - t2;
        });

        if(list.length === 0) {
          box.innerHTML = `<div class="text-center text-slate-500 text-xs py-20">Phòng chưa có tin nhắn. Hãy gửi tin nhắn đầu tiên!</div>`;
          return;
        }

        list.forEach(msg => appendMessageUI(msg));

        // Chỉ cuộn xuống đáy nếu người dùng đang ở sát đáy (tránh nảy màn hình khi xem lại tin cũ)
        if (isAtBottom) {
          box.scrollTop = box.scrollHeight;
        }
      });
    }

    function appendMessageUI(msg) {
      const box = document.getElementById('messages-container');
      const isMe = msg.uid === currentUser.uid;

      const div = document.createElement('div');
      div.className = `flex items-start gap-3 group px-4 py-2 hover:bg-slate-900/30 rounded-xl transition`;
      
      const avatarHTML = msg.avatar ? `<img src="${msg.avatar}" class="w-full h-full object-cover rounded-xl">` : `<div class="w-full h-full bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-xs">${(msg.senderTag||'3M').substring(0,2).toUpperCase()}</div>`;

      div.innerHTML = `
        <div onclick="openProfileModal('${msg.uid}')" class="w-10 h-10 flex-shrink-0 cursor-pointer hover:scale-105 transition">
          ${avatarHTML}
        </div>
        <div class="flex-1 overflow-hidden">
          <div class="flex items-center gap-2">
            <span onclick="openProfileModal('${msg.uid}')" class="font-bold text-xs ${isMe ? 'text-emerald-400' : 'text-blue-400'} cursor-pointer hover:underline">${escapeHtml(msg.senderTag || 'Thành viên')}</span>
          </div>
          ${msg.text ? `<p class="text-sm text-slate-200 mt-1 break-words leading-relaxed">${escapeHtml(msg.text)}</p>` : ''}
          ${msg.image ? `<img src="${msg.image}" class="mt-2 max-w-xs max-h-60 rounded-xl border border-slate-800 object-cover">` : ''}
        </div>
        ${isMe ? `
          <button onclick="deleteMessage('${msg.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 p-1 text-xs transition" title="Xóa">
            <i class="fa-solid fa-trash"></i>
          </button>
        ` : ''}
      `;
      box.appendChild(div);
    }

    window.deleteMessage = async (id) => {
      if (confirm("Bạn có chắc muốn xóa tin nhắn này?")) {
        await deleteDoc(doc(db, "messages", id));
      }
    };

    // Phân biệt Profile chính mình & người khác
    window.openProfileModal = async (targetUid) => {
      if (!targetUid) return;
      const modal = document.getElementById('profile-modal');
      modal.classList.remove('hidden');

      const targetRef = doc(db, "users", targetUid);
      const snap = await getDoc(targetRef);

      let uData = { displayName: "Thành viên", avatar: "", hearts: 0, createdAt: "Mới đây" };
      if (snap.exists()) uData = snap.data();

      document.getElementById('modal-display-name').innerText = uData.displayName || "Thành viên";
      document.getElementById('modal-hearts-count').innerText = uData.hearts || 0;
      document.getElementById('modal-created-date').innerText = uData.createdAt || "Mới đây";
      
      const avatarBox = document.getElementById('modal-avatar-box');
      if (uData.avatar) {
        avatarBox.innerHTML = `<img src="${uData.avatar}" class="w-full h-full object-cover">`;
      } else {
        avatarBox.innerText = (uData.displayName || "3M").substring(0, 2).toUpperCase();
      }

      window.currentViewingUid = targetUid;

      // Phân quyền hiển thị UI
      if (targetUid === currentUser.uid) {
        document.getElementById('self-edit-section').classList.remove('hidden');
        document.getElementById('other-action-section').classList.add('hidden');
        document.getElementById('edit-display-name').value = myDisplayName;
        document.getElementById('edit-avatar-url').value = myAvatar;
      } else {
        document.getElementById('self-edit-section').classList.add('hidden');
        document.getElementById('other-action-section').classList.remove('hidden');
      }
    };

    window.closeModal = () => document.getElementById('profile-modal').classList.add('hidden');

    // Chỉnh sửa hồ sơ cá nhân (Đổi tên & Đổi Avatar từ file hoặc URL)
    window.handleAvatarFileUpload = (input) => {
      const file = input.files[0];
      if (file) {
        if (file.size > 1.5 * 1024 * 1024) return alert("Ảnh đại diện phải nhỏ hơn 1.5MB!");
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('edit-avatar-url').value = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    window.saveMyProfile = async () => {
      const newName = document.getElementById('edit-display-name').value.trim();
      const newAvatar = document.getElementById('edit-avatar-url').value.trim();
      if (!newName) return alert("Tên hiển thị không được để trống!");

      const userRef = doc(db, "users", currentUser.uid);
      await updateDoc(userRef, { displayName: newName, avatar: newAvatar });
      myDisplayName = newName;
      myAvatar = newAvatar;
      updateMyProfileUI();
      alert("✅ Đã cập nhật hồ sơ thành công!");
      closeModal();
    };

    function updateMyProfileUI() {
      document.getElementById('my-display-name-tag').innerText = myDisplayName;
      const avatarBox = document.getElementById('my-avatar-box');
      if (myAvatar) {
        avatarBox.innerHTML = `<img src="${myAvatar}" class="w-full h-full object-cover">`;
      } else {
        avatarBox.innerText = myDisplayName.substring(0, 2).toUpperCase();
      }
    }

    window.sendHeartToUser = async () => {
      const targetUid = window.currentViewingUid;
      if (!targetUid) return;
      const targetRef = doc(db, "users", targetUid);
      const snap = await getDoc(targetRef);
      if (snap.exists()) {
        const currentH = snap.data().hearts || 0;
        const newH = currentH + 1;
        await updateDoc(targetRef, { hearts: newH });
        document.getElementById('modal-hearts-count').innerText = newH;
        alert("❤️ Đã thả tim thành công!");
      }
    };

    window.sendFriendRequest = () => {
      alert("✅ Đã gửi lời mời kết bạn!");
      closeModal();
    };

    window.reportUserModal = async () => {
      const reason = prompt("Nhập lý do báo cáo:");
      if (!reason) return;
      const targetUid = window.currentViewingUid;
      try {
        const targetRef = doc(db, "users", targetUid);
        const tSnap = await getDoc(targetRef);
        if (tSnap.exists()) {
          const currentRep = tSnap.data().reportsCount || 0;
          if (currentRep >= 1) {
            await updateDoc(targetRef, { restricted: true, reportsCount: currentRep + 1 });
            alert("🚨 Đã gửi báo cáo. Hệ thống đã khóa tương tác tài khoản này!");
          } else {
            await updateDoc(targetRef, { reportsCount: currentRep + 1 });
            alert("⚠️ Đã gửi báo cáo thành công.");
          }
        }
      } catch (err) {
        alert("Lỗi: " + err.message);
      }
      closeModal();
    };

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="h-[100dvh] flex flex-col select-none">

  <!-- ================= AUTH SCREEN ================= -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#05070a] p-4">
    <div class="glass-panel p-8 rounded-3xl w-full max-w-md shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black shadow-lg mb-3">
          <i class="fa-solid fa-mountain-sun"></i>
        </div>
        <h1 class="text-3xl font-black tracking-wider text-white">3 MIỀN</h1>
        <p class="text-xs text-slate-400 mt-1">Kết Nối Trò Chuyện & Voice Call Bảo Mật</p>
      </div>

      <div id="auth-error" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3 rounded-xl text-xs mb-4"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Email (@gmail.com)</label>
          <input type="email" id="auth-email" required class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="name@gmail.com">
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Mật khẩu</label>
          <input type="password" id="auth-password" required class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
        </div>
        
        <div class="flex gap-3 pt-2">
          <button onclick="loginUser()" class="flex-1 bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/20">
            Đăng Nhập
          </button>
          <button onclick="registerUser()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-sm transition">
            Đăng Ký
          </button>
        </div>

        <div id="resend-box" class="hidden text-center pt-2">
          <button onclick="resendVerificationEmail()" class="text-xs text-blue-400 hover:underline">🔄 Gửi lại mã xác minh Gmail</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= GIAO DIỆN CHÍNH ================= -->
  <div id="app-screen" class="hidden flex-1 flex h-full overflow-hidden relative">
    
    <button onclick="toggleSidebar()" class="md:hidden absolute top-3 left-3 z-30 bg-slate-800 text-white p-2 rounded-xl text-xs shadow">
      <i class="fa-solid fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <div id="sidebar" class="absolute md:relative inset-y-0 left-0 z-20 w-72 bg-[#0b0f19] border-r border-slate-800/80 flex flex-col justify-between transform -translate-x-full md:translate-x-0 transition duration-300 shadow-2xl md:shadow-none">
      
      <!-- DANH SÁCH PHÒNG CHAT -->
      <div class="flex-1 overflow-y-auto">
        <div class="p-4 border-b border-slate-800/80 flex items-center justify-between sticky top-0 bg-[#0b0f19] z-10">
          <span class="font-black text-sm tracking-widest text-blue-400 flex items-center gap-2">
            <i class="fa-solid fa-mountain-sun"></i> 3 MIỀN CHAT
          </span>
          <button onclick="createNewPrivateGroup()" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-2.5 py-1 rounded-lg text-xs font-bold transition">
            + Tạo Nhóm
          </button>
        </div>

        <div class="p-3 space-y-1.5">
          <div class="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Khu vực Sảnh Chung</div>
          <button onclick="switchRoom('mien-bac-chung', '# 🏔️ Miền Bắc - Sảnh Chung')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center gap-2">
            <i class="fa-solid fa-snowflake text-cyan-400"></i> Miền Bắc
          </button>
          <button onclick="switchRoom('mien-trung-chung', '# 🏖️ Miền Trung - Sảnh Chung')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center gap-2">
            <i class="fa-solid fa-sun text-amber-400"></i> Miền Trung
          </button>
          <button onclick="switchRoom('mien-nam-chung', '# 🌴 Miền Nam - Sảnh Chung')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center gap-2">
            <i class="fa-solid fa-water text-emerald-400"></i> Miền Nam
          </button>

          <div class="pt-3 text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Nhóm Riêng & AI Bot</div>
          <button onclick="switchRoom('nhom-ai-tro-ly', '# 🤖 Trò Chuyện Cùng AI Trợ Lý')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-blue-400 hover:bg-slate-800/60 transition flex items-center gap-2">
            <i class="fa-solid fa-robot"></i> Trò chuyện AI Bot (@ai)
          </button>
          <div id="custom-groups-list" class="space-y-1"></div>
        </div>
      </div>

      <!-- CỤM VOICE CALL NẰM ĐÈ SÁT ĐÁY NGHĨA LÀ TRÊN USER PROFILE -->
      <div class="p-3 border-t border-slate-800/80 bg-[#07090e] space-y-2 flex-shrink-0">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Voice Call (Discord)
          </span>
          <span id="my-peer-id-badge" class="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded cursor-pointer hover:bg-slate-700" onclick="copyMyID()" title="Bấm copy ID">Copy ID</span>
        </div>
        
        <div class="flex items-center gap-2 text-[10px] text-slate-400 bg-[#0b0f19] px-2 py-1 rounded-lg border border-slate-800">
          <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="noise-suppression" checked class="accent-emerald-500"> Khử ồn</label>
          <div class="flex items-center gap-1 ml-auto">
            <span>Vol:</span>
            <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="1" class="w-16 accent-emerald-500" onchange="adjustVolume(this.value)">
          </div>
        </div>

        <div class="flex gap-1">
          <input type="text" id="target-peer-input" placeholder="Dán ID bạn bè..." class="flex-1 bg-[#0b0f19] border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
          <button onclick="callPeer()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">Gọi</button>
          <button onclick="hangUpCall()" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-2 py-1.5 rounded-lg text-xs transition" title="Ngắt"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
      </div>

      <!-- USER PROFILE BAR Ở CẠNH CÙNG DƯỚI ĐÁY SIDEBAR -->
      <div class="p-3 border-t border-slate-800/80 flex items-center justify-between bg-[#040609] flex-shrink-0">
        <div onclick="openProfileModal(currentUser.uid)" class="flex items-center gap-2 overflow-hidden cursor-pointer flex-1">
          <div id="my-avatar-box" class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-xs text-white shadow overflow-hidden flex-shrink-0">3M</div>
          <div class="truncate">
            <div id="my-display-name-tag" class="text-xs font-bold text-slate-200 truncate">User#0000</div>
            <div class="text-[9px] text-slate-500">Bấm đổi tên & avatar</div>
          </div>
        </div>
        <button onclick="logoutUser()" class="text-slate-500 hover:text-rose-400 text-xs p-2 transition ml-1" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>

    <!-- MAIN CHAT WORKSPACE -->
    <div class="flex-1 flex flex-col bg-[#07090e] h-full overflow-hidden">
      <!-- Chat Header -->
      <div class="h-14 border-b border-slate-800/80 px-4 md:px-6 flex items-center justify-between bg-[#0b0f19]/60 backdrop-blur flex-shrink-0">
        <h2 id="room-title" class="font-bold text-sm text-white pl-8 md:pl-0"># 🏔️ Miền Bắc - Sảnh Chung</h2>
        <button onclick="sharePrivateInvite()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold text-slate-300 transition flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-share-nodes"></i> Chia sẻ phòng
        </button>
      </div>

      <!-- Messages Stream -->
      <div id="messages-container" class="flex-1 chat-messages-scroll p-4 md:p-6 space-y-2"></div>

      <!-- Chat Input Area -->
      <div class="p-3 md:p-4 bg-[#0b0f19] border-t border-slate-800/80 flex-shrink-0">
        
        <!-- Preview Ảnh đính kèm -->
        <div id="image-preview-container" class="hidden mb-2 relative inline-block">
          <img id="image-preview" class="h-20 rounded-xl border border-slate-700 object-cover">
          <button onclick="removeAttachedImage()" class="absolute -top-2 -right-2 bg-rose-600 text-white w-5 h-5 rounded-full text-xs flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form id="chat-form" class="bg-[#07090e] border border-slate-800 rounded-2xl px-4 py-2.5 flex items-center gap-3 shadow-inner">
          
          <!-- Nút đính kèm File / Ảnh -->
          <label class="cursor-pointer text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-paperclip text-sm"></i>
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleImageAttach(this)">
          </label>

          <input type="text" id="chat-input" autocomplete="off" placeholder="Nhập tin nhắn hoặc gõ @ai [nội dung]..." class="flex-1 bg-transparent text-sm text-white focus:outline-none">

          <button type="button" onclick="insertEmoji('🔥')" class="text-sm hover:scale-110 transition">🔥</button>
          <button type="button" onclick="insertEmoji('😂')" class="text-sm hover:scale-110 transition">😂</button>
          <button type="button" onclick="insertEmoji('👍')" class="text-sm hover:scale-110 transition">👍</button>

          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-blue-600/20 flex items-center gap-1.5">
            <span>Gửi</span> <i class="fa-solid fa-paper-plane text-[10px]"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= MODAL PROFILE (CHÍNH MÌNH VÀ NGƯỜI KHÁC) ================= -->
  <div id="profile-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">
    <div class="glass-panel p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      
      <div id="modal-avatar-box" class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 mx-auto flex items-center justify-center text-white text-2xl font-black shadow-lg mb-3 overflow-hidden">3M</div>
      
      <h3 id="modal-display-name" class="text-lg font-bold text-white">Thành viên</h3>
      <p class="text-[10px] text-slate-400 mt-1">Gia nhập: <span id="modal-created-date" class="text-blue-400 font-semibold">--/--/----</span></p>
      
      <div class="my-3 py-2 bg-[#07090e] rounded-xl border border-slate-800 flex justify-around items-center text-xs">
        <div><span id="modal-hearts-count" class="font-black text-rose-500 text-base">0</span> ❤️ Tim Tương Tác</div>
      </div>

      <!-- NẾU LÀ PROFILE CHÍNH MÌNH -->
      <div id="self-edit-section" class="hidden space-y-3 text-left mt-4 border-t border-slate-800 pt-3">
        <h4 class="text-xs font-bold text-blue-400 uppercase">Chỉnh sửa thông tin cá nhân</h4>
        <div>
          <label class="block text-[10px] text-slate-400 mb-1">Tên hiển thị mới:</label>
          <input type="text" id="edit-display-name" class="w-full bg-[#07090e] border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 mb-1">Ảnh Đại Diện (Avatar):</label>
          <div class="flex gap-2">
            <input type="text" id="edit-avatar-url" class="flex-1 bg-[#07090e] border border-slate-800 rounded-lg px-3 py-2 text-xs text-white" placeholder="Dán URL ảnh hoặc tải lên...">
            <label class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-xs font-bold text-slate-300 cursor-pointer flex items-center">
              <i class="fa-solid fa-upload"></i>
              <input type="file" accept="image/*" class="hidden" onchange="handleAvatarFileUpload(this)">
            </label>
          </div>
        </div>
        <button onclick="saveMyProfile()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-blue-600/20">Lưu Thay Đổi</button>
      </div>

      <!-- NẾU LÀ PROFILE NGƯỜI KHÁC -->
      <div id="other-action-section" class="hidden mt-6 space-y-2.5">
        <button onclick="sendHeartToUser()" class="w-full bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 text-rose-400 font-bold py-2.5 rounded-xl text-xs transition">
          ❤️ Thả Tim Tương Tác
        </button>
        <button onclick="sendFriendRequest()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
          <i class="fa-solid fa-user-plus"></i> Kết Bạn
        </button>
        <button onclick="reportUserModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition">
          <i class="fa-solid fa-triangle-exclamation"></i> Báo Cáo Vi Phạm
        </button>
      </div>
    </div>
  </div>

  <audio id="remote-audio" autoplay></audio>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    }
    function insertEmoji(em) {
      const inp = document.getElementById('chat-input');
      inp.value += em;
      inp.focus();
    }
    function createNewPrivateGroup() {
      const name = prompt("Nhập tên nhóm riêng tư mới:");
      if (!name) return;
      const cleanName = "nhom-" + name.toLowerCase().replace(/\s+/g, '-') + "-" + Math.floor(Math.random() * 1000);
      
      const list = document.getElementById('custom-groups-list');
      const btn = document.createElement('button');
      btn.className = "w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center justify-between";
      btn.innerHTML = `<span onclick="switchRoom('${cleanName}', '# 🔒 Nhóm: ${name}')"># ${name}</span> <span class="text-[9px] text-emerald-400">Riêng tư</span>`;
      list.appendChild(btn);
      switchRoom(cleanName, '# 🔒 Nhóm: ' + name);
    }
    function sharePrivateInvite() {
      navigator.clipboard.writeText(window.location.href);
      alert("Đã sao chép liên kết phòng!");
    }

    // PEERJS VOICE CALL LOGIC
    let peer = new Peer();
    let myPeerID = "";
    let activeCall = null;
    let localStream = null;

    peer.on('open', (id) => {
      myPeerID = id;
      const badge = document.getElementById('my-peer-id-badge');
      if(badge) badge.innerText = "ID: " + id.substring(0, 4) + "...";
    });

    peer.on('call', async (call) => {
      if (confirm("📞 Có cuộc gọi thoại riêng từ bạn bè! Nhận cuộc gọi?")) {
        try {
          const noiseOn = document.getElementById('noise-suppression').checked;
          localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: noiseOn, noiseSuppression: noiseOn } });
          call.answer(localStream);
          activeCall = call;
          call.on('stream', (remoteStream) => {
            const audio = document.getElementById('remote-audio');
            audio.srcObject = remoteStream;
            audio.play();
          });
        } catch(e) {
          alert("Không thể truy cập Micro!");
        }
      }
    });

    async function callPeer() {
      const tid = document.getElementById('target-peer-input').value.trim();
      if (!tid) return alert("Vui lòng dán ID bạn bè để gọi!");

      try {
        const noiseOn = document.getElementById('noise-suppression').checked;
        localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: noiseOn, noiseSuppression: noiseOn } });
        const call = peer.call(tid, localStream);
        activeCall = call;
        call.on('stream', (remoteStream) => {
          const audio = document.getElementById('remote-audio');
          audio.srcObject = remoteStream;
          audio.play();
        });
        alert("Đang kết nối thoại...");
      } catch(e) {
        alert("Không thể mở Micro thiết bị!");
      }
    }

    function hangUpCall() {
      if (activeCall) {
        activeCall.close();
        activeCall = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      alert("📴 Đã kết thúc cuộc gọi.");
    }

    function adjustVolume(val) {
      document.getElementById('remote-audio').volume = val;
    }

    function copyMyID() {
      if(!myPeerID) return;
      navigator.clipboard.writeText(myPeerID);
      alert("Đã copy Voice ID: " + myPeerID);
    }
  </script>
</body>
</html>
