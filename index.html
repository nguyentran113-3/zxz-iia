<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AnonChat & Voice - Ẩn Danh Absolute</title>
  <!-- Tailwind CSS cho Giao diện dạng Discord/Messenger -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- PeerJS cho WebRTC Voice Call -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col overflow-hidden">

  <!-- 1. MÀN HÌNH ĐĂNG KÝ / XÁC MINH EMAIL -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950">
    <div class="bg-slate-900 p-8 rounded-xl border border-slate-800 w-full max-w-md shadow-2xl">
      <h2 class="text-2xl font-bold mb-2 text-indigo-400 text-center">ANON CHAT</h2>
      <p class="text-xs text-slate-400 mb-6 text-center">Bảo mật tuyệt đối • Xác minh Email mới được vào</p>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Email</label>
          <input type="email" id="auth-email" required class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-sm focus:outline-none focus:border-indigo-500" placeholder="user@gmail.com" />
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Mật khẩu</label>
          <input type="password" id="auth-password" required class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-sm focus:outline-none focus:border-indigo-500" placeholder="••••••••" />
        </div>
        <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-700 font-bold py-2.5 rounded text-sm transition">
          Đăng ký / Đăng nhập
        </button>
      </form>
      <div id="auth-msg" class="mt-4 text-xs text-center text-amber-400"></div>
    </div>
  </div>

  <!-- 2. GIAO DIỆN CHÍNH APP (DISCORD x MESSENGER STYLE) -->
  <div id="app-screen" class="hidden flex-1 flex h-full">
    
    <!-- Sidebar bên trái: Bạn bè & Phòng -->
    <div class="w-80 bg-slate-950 border-r border-slate-800 flex flex-col">
      <!-- User Profile Header -->
      <div class="p-4 border-b border-slate-800 flex items-center gap-3">
        <img id="my-avatar" class="w-10 h-10 rounded-full bg-indigo-500 object-cover" src="https://api.dicebear.com/7.x/bottts/svg?seed=Anon" />
        <div class="flex-1 overflow-hidden">
          <div id="my-name" class="font-bold text-sm truncate">User_Anonymous</div>
          <div id="my-username" class="text-xs text-slate-500 truncate">@anon_0000</div>
        </div>
        <button id="btn-profile-edit" class="text-slate-400 hover:text-white text-xs">Sửa</button>
      </div>

      <!-- Tìm kiếm bạn bè -->
      <div class="p-3 border-b border-slate-800">
        <input type="text" id="search-user" placeholder="Tìm username bạn bè..." class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500" />
      </div>

      <!-- Danh sách Chat DMs & Voice -->
      <div class="flex-1 overflow-y-auto p-2 space-y-1" id="chat-list">
        <div class="text-xs font-bold text-slate-500 px-2 py-1 uppercase">Kênh Voice Public</div>
        <button class="w-full flex items-center gap-2 p-2 hover:bg-slate-900 rounded text-left text-sm text-indigo-400">
          🔊 Phòng Voice Troll #1
        </button>
        <div class="text-xs font-bold text-slate-500 px-2 py-1 uppercase mt-4">Tin Nhắn Trực Tiếp</div>
        <!-- Bạn bè sẽ render ở đây -->
      </div>
    </div>

    <!-- Khung Chat Trung Tâm -->
    <div class="flex-1 flex flex-col bg-slate-900">
      <!-- Header Chat Window -->
      <div class="h-14 border-b border-slate-800 px-4 flex items-center justify-between bg-slate-950/50">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-green-500"></div>
          <span id="chat-title" class="font-bold text-sm">Phòng Chat Chung (Public)</span>
        </div>
        <!-- Nút Voice Call -->
        <button id="btn-start-call" class="bg-green-600 hover:bg-green-700 px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1">
          📞 Call Voice
        </button>
      </div>

      <!-- Khung Nội Dung Tin Nhắn -->
      <div id="messages-box" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="text-center text-xs text-slate-600">-- Tin nhắn được mã hóa an toàn --</div>
      </div>

      <!-- Input Nhập Tin Nhắn -->
      <div class="p-3 border-t border-slate-800 bg-slate-950">
        <form id="msg-form" class="flex gap-2">
          <input type="text" id="msg-input" placeholder="Nhập tin nhắn..." class="flex-1 bg-slate-900 border border-slate-800 rounded px-4 py-2 text-sm focus:outline-none focus:border-indigo-500" />
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded font-bold text-sm">Gửi</button>
        </form>
      </div>
    </div>
  </div>

  <!-- SCRIPT LOGIC XỬ LÝ -->
  <script>
    // 1. Cấu hình Supabase (Thay URL & AnonKey của dự án bạn tạo trên Supabase.com vào đây)
    const SUPABASE_URL = " https://gtbgsjdbavbzrquxxaph.supabase.co";
    const SUPABASE_KEY = " sb_publishable_EzQFcTP0Js29V1GXKaPxMg__tUjJti1";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let peer = null;

    // 2. Xử lý Đăng ký / Xác minh Email
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const msg = document.getElementById('auth-msg');

      msg.innerText = "Đang xử lý...";

      // Đăng nhập thử trước
      const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({ email, password });

      if (signInError) {
        // Nếu chưa có tài khoản -> Tạo tài khoản mới
        const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password });
        if (signUpError) {
          msg.innerText = "Lỗi: " + signUpError.message;
        } else {
          msg.innerText = "📧 Một link xác minh đã được gửi về Email của bạn. Hãy bấm vào link trong email để kích hoạt!";
        }
      } else {
        // Đã có tài khoản -> Kiểm tra xác minh email chưa
        if (!signInData.user.email_confirmed_at) {
          msg.innerText = "⚠️ Bạn chưa bấm xác minh trong Email!";
          return;
        }
        currentUser = signInData.user;
        initApp();
      }
    });

    // 3. Khởi tạo App sau khi xác minh Email thành công
    function initApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');

      // Khởi tạo PeerJS để gọi Voice
      peer = new Peer(currentUser.id);
      
      peer.on('call', (call) => {
        if (confirm("Có cuộc gọi voice đến! Trả lời?")) {
          navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
            call.answer(stream);
            call.on('stream', (remoteStream) => {
              const audio = new Audio();
              audio.srcObject = remoteStream;
              audio.play();
            });
          });
        }
      });
    }

    // 4. Xử lý Gọi Voice
    document.getElementById('btn-start-call').addEventListener('click', () => {
      const targetPeerId = prompt("Nhập ID (User ID) của người bạn muốn gọi:");
      if (!targetPeerId) return;

      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
        const call = peer.call(targetPeerId, stream);
        call.on('stream', (remoteStream) => {
          const audio = new Audio();
          audio.srcObject = remoteStream;
          audio.play();
        });
      });
    });
  </script>
</body>
</html>
