<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 MIỀN - Trò Chuyện, Voice Call & AI Đỉnh Cao</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    * { box-sizing: border-box; }
    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #07090e;
      color: #f1f5f9;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

    .glass-panel { background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }

    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message-animation { animation: messageSlideIn 0.2s ease-out forwards; }

    /* Hiệu ứng tim rơi Custom cho mốc trên 20 tim */
    @keyframes heartRain {
      0% { transform: translateY(-10px) scale(0.6); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(120px) scale(1.2) rotate(360deg); opacity: 0; }
    }
    .custom-heart-effect {
      position: absolute;
      color: #ec4899;
      font-size: 14px;
      animation: heartRain 3s linear infinite;
      pointer-events: none;
    }

    .chat-messages-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, deleteDoc, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkkQ15xThXoybm7uTbj1-IeHSmzgSA3nw",
      authDomain: "mien-77222.firebaseapp.com",
      projectId: "mien-77222",
      storageBucket: "mien-77222.firebasestorage.app",
      messagingSenderId: "856316713030",
      appId: "1:856316713030:web:9f7d44ecd9a1e1e7df9247"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence); // Duy trì trạng thái không bị mất khi thoát app/web
    const db = getFirestore(app);

    let currentUser = null;
    let currentRoom = "mien-bac-chung";
    let myAnonTag = "";
    let myDisplayName = "";
    let myAvatar = "";
    let myHearts = 0;
    let myCreatedAt = "";
    let unsubsMessages = null;
    let lastMessageContent = "";
    let spamCount = 0;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (!user.emailVerified) {
          showAuthError("⚠️ Hãy vào hộp thư Gmail để bấm link xác minh tài khoản!");
          document.getElementById('resend-box').classList.remove('hidden');
          await signOut(auth);
          return;
        }
        currentUser = user;
        myAnonTag = "User#" + user.uid.substring(0, 6).toUpperCase();
        myCreatedAt = user.metadata.creationTime ? new Date(user.metadata.creationTime).toLocaleDateString('vi-VN') : "Mới đây";

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) {
          myDisplayName = myAnonTag;
          myAvatar = "";
          myHearts = 0;
          await setDoc(userRef, { email: user.email, tag: myAnonTag, displayName: myDisplayName, avatar: myAvatar, hearts: 0, createdAt: myCreatedAt, restricted: false });
        } else {
          const data = userSnap.data();
          myDisplayName = data.displayName || myAnonTag;
          myAvatar = data.avatar || "";
          myHearts = data.hearts || 0;
          if (data.restricted) {
            alert("❌ Tài khoản của bạn đã bị hạn chế do có nhiều báo cáo từ cộng đồng!");
          }
        }

        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        updateMyProfileUI();
        loadMessages(currentRoom);
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    });

    window.registerUser = async () => {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!email.endsWith("@gmail.com")) return showAuthError("❌ Chỉ chấp nhận địa chỉ đuôi @gmail.com hợp lệ!");
      if (pass.length < 6) return showAuthError("Mật khẩu phải từ 6 ký tự trở lên.");

      try {
        const res = await createUserWithEmailAndPassword(auth, email, pass);
        await sendEmailVerification(res.user);
        alert("📧 Đã gửi thư xác thực đến Gmail của bạn. Hãy kiểm tra Hộp thư đến hoặc Thư rác (Spam)!");
        document.getElementById('resend-box').classList.remove('hidden');
      } catch (err) {
        showAuthError("Lỗi đăng ký: " + err.message);
      }
    };

    window.loginUser = async () => {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!email || !pass) return showAuthError("Vui lòng điền đầy đủ thông tin!");
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        showAuthError("Sai tài khoản hoặc mật khẩu đăng nhập.");
      }
    };

    window.resendVerificationEmail = async () => {
      try {
        if (auth.currentUser) {
          await sendEmailVerification(auth.currentUser);
          alert("📨 Đã gửi lại email xác thực thành công!");
        } else {
          alert("Vui lòng đăng nhập lại thông tin để gửi lại mã xác thực.");
        }
      } catch(e) {
        alert("Thao tác quá nhanh. Vui lòng thử lại sau ít phút.");
      }
    };

    window.logoutUser = () => signOut(auth);

    // Gửi tin nhắn & Xử lý Anti-Spam
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const userRef = doc(db, "users", currentUser.uid);
      const userSnap = await getDoc(userRef);
      if (userSnap.exists() && userSnap.data().restricted) {
        return alert("❌ Tài khoản của bạn đang bị hạn chế tương tác do vi phạm từ các báo cáo trước đó!");
      }

      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      // Anti-Spam lặp lại nội dung liên tục
      if (text === lastMessageContent) {
        spamCount++;
        if (spamCount >= 4) {
          await updateDoc(userRef, { restricted: true });
          alert("🚨 Bạn đã gửi liên tục các nội dung trùng lặp quá nhiều lần! Hệ thống đã liệt vào danh sách spam và hạn chế tài khoản.");
          return;
        }
      } else {
        spamCount = 0;
        lastMessageContent = text;
      }

      input.value = '';

      // Xử lý AI Bot riêng tư hoặc trong nhóm riêng
      if (text.startsWith("@ai ") || currentRoom.startsWith("nhom-")) {
        if (text.startsWith("@ai ") || currentRoom.includes("ai-")) {
          const promptText = text.replace("@ai", "").trim();
          // Thêm tin nhắn user
          await addDoc(collection(db, "messages"), {
            room: currentRoom, text: text, senderTag: myDisplayName + " ("+myAnonTag+")", avatar: myAvatar, uid: currentUser.uid, createdAt: serverTimestamp()
          });
          // Phản hồi từ AI Bot thân thiện GenZ
          setTimeout(async () => {
            const botReply = generateAIBotResponse(promptText);
            await addDoc(collection(db, "messages"), {
              room: currentRoom, text: "🤖 [AI 3 Miền]: " + botReply, senderTag: "AI Trợ Lý", avatar: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png", uid: "bot-ai-system", createdAt: serverTimestamp()
            });
          }, 600);
          return;
        }
      }

      try {
        await addDoc(collection(db, "messages"), {
          room: currentRoom,
          text: text,
          senderTag: myDisplayName + " (" + myAnonTag + ")",
          avatar: myAvatar,
          uid: currentUser.uid,
          createdAt: serverTimestamp()
        });
      } catch (err) {
        console.error("Lỗi gửi:", err);
      }
    });

    // AI Bot logic thông minh, thân thiện, GenZ, từ chối việc phá hoại/hacker
    function generateAIBotResponse(query) {
      const q = query.toLowerCase();
      if (q.includes("hack") || q.includes("phá hoại") || q.includes("tấn công") || q.includes("đánh sập")) {
        return "Ôi dồi ôi, mấy chuyện hack hay phá hoại web là mình xin phép từ chối ngay và luôn nha bro! Mình hệ thống chính chuyên, chỉ giúp những điều vui vẻ, tích cực thôi nè! ✨";
      }
      if (q.includes("chào") || q.includes("hi") || q.includes("hello")) {
        return "Hé lô bạn iu! Mình là AI trợ lý của 3 Miền đây. Hôm nay cần mình hỗ trợ gì cứ nói nha, luôn sẵn sàng lắng nghe! 💙";
      }
      if (q.includes("thời tiết") || q.includes("buồn")) {
        return "Đừng buồn nữa nha, có tụi mình ở đây trò chuyện cùng bạn nè! Cuộc sống có lúc nắng lúc mưa như 3 Miền vậy đó, cứ chill đi mọi chuyện sẽ ổn thui! ☕";
      }
      return `À, câu hỏi "${query}" nghe cuốn phết nhờ! Theo góc nhìn của mình thì cứ thoải mái tận hưởng không gian kết nối này nha, cần gì cứ hỏi tiếp đi nè! 😎`;
    }

    window.switchRoom = (roomName, roomTitle) => {
      currentRoom = roomName;
      document.getElementById('room-title').innerText = roomTitle || ("# " + roomName);
      loadMessages(roomName);
    };

    function loadMessages(room) {
      if (unsubsMessages) unsubsMessages();
      const q = query(collection(db, "messages"));
      
      unsubsMessages = onSnapshot(q, (snapshot) => {
        const box = document.getElementById('messages-container');
        box.innerHTML = '';
        let list = [];
        
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if ((data.room || 'mien-bac-chung') === room) {
            list.push({ id: docSnap.id, ...data });
          }
        });

        list.sort((a, b) => {
          const t1 = a.createdAt ? a.createdAt.toMillis() : Date.now();
          const t2 = b.createdAt ? b.createdAt.toMillis() : Date.now();
          return t1 - t2;
        });

        if(list.length === 0) {
          box.innerHTML = `<div class="text-center text-slate-500 text-xs py-16">Phòng này chưa có tin nhắn nào. Hãy bắt đầu trò chuyện hoặc gọi @ai để hỏi thăm!</div>`;
          return;
        }

        list.forEach(msg => appendMessageUI(msg));
        box.scrollTop = box.scrollHeight;
      });
    }

    function appendMessageUI(msg) {
      const box = document.getElementById('messages-container');
      const isMe = msg.uid === currentUser.uid;

      const div = document.createElement('div');
      div.className = `flex items-start gap-3 group px-4 py-2.5 hover:bg-slate-900/40 rounded-xl transition message-animation`;
      
      const avatarContent = msg.avatar ? `<img src="${msg.avatar}" class="w-full h-full object-cover">` : (msg.senderTag ? msg.senderTag.substring(0, 2).toUpperCase() : '3M');

      div.innerHTML = `
        <div onclick="openProfileModal('${msg.uid}', '${msg.senderTag}')" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white text-xs shadow-md cursor-pointer hover:scale-105 transition flex-shrink-0 overflow-hidden">
          ${avatarContent}
        </div>
        <div class="flex-1 overflow-hidden">
          <div class="flex items-center gap-2">
            <span onclick="openProfileModal('${msg.uid}', '${msg.senderTag}')" class="font-bold text-xs text-blue-400 cursor-pointer hover:underline">${msg.senderTag}</span>
            <span class="text-[9px] text-slate-500">Gần đây</span>
          </div>
          <p class="text-sm text-slate-200 mt-1 break-words leading-relaxed">${escapeHtml(msg.text)}</p>
        </div>
        ${isMe ? `
          <button onclick="deleteMessage('${msg.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 p-1 text-xs transition" title="Xóa tin nhắn">
            <i class="fa-solid fa-trash"></i>
          </button>
        ` : ''}
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    window.deleteMessage = async (id) => {
      if (confirm("Bạn có chắc muốn xóa tin nhắn này?")) {
        await deleteDoc(doc(db, "messages", id));
      }
    };

    // Quản lý Profile, Thả Tim & Đặc quyền
    window.openProfileModal = async (uid, tag) => {
      const modal = document.getElementById('profile-modal');
      modal.classList.remove('hidden');

      document.getElementById('modal-username').innerText = tag;
      document.getElementById('modal-uid-val').innerText = uid;

      const targetRef = doc(db, "users", uid);
      const snap = await getDoc(targetRef);
      let hearts = 0;
      let cDate = "Không rõ";
      if (snap.exists()) {
        const d = snap.data();
        hearts = d.hearts || 0;
        cDate = d.createdAt || "Mới đây";
      }

      document.getElementById('modal-hearts-count').innerText = hearts;
      document.getElementById('modal-created-date').innerText = cDate;

      // Phân quyền hiển thị nút Profile chính mình hay người khác
      if (uid === currentUser.uid) {
        document.getElementById('self-edit-section').classList.remove('hidden');
        document.getElementById('other-action-section').classList.add('hidden');
      } else {
        document.getElementById('self-edit-section').classList.add('hidden');
        document.getElementById('other-action-section').classList.remove('hidden');
        window.currentViewingUid = uid;
      }
    };

    window.closeModal = () => {
      document.getElementById('profile-modal').classList.add('hidden');
    };

    window.saveMyProfile = async () => {
      const newName = document.getElementById('edit-display-name').value.trim();
      const newAvatar = document.getElementById('edit-avatar-url').value.trim();
      if (!newName) return alert("Tên hiển thị không được để trống!");

      const userRef = doc(db, "users", currentUser.uid);
      await updateDoc(userRef, { displayName: newName, avatar: newAvatar });
      myDisplayName = newName;
      myAvatar = newAvatar;
      updateMyProfileUI();
      alert("✅ Cập nhật hồ sơ thành công!");
      closeModal();
    };

    function updateMyProfileUI() {
      document.getElementById('my-display-name-tag').innerText = myDisplayName;
      const avatarBox = document.getElementById('my-avatar-box');
      if (myAvatar) {
        avatarBox.innerHTML = `<img src="${myAvatar}" class="w-full h-full object-cover">`;
      } else {
        avatarBox.innerText = myDisplayName.substring(0, 2).toUpperCase();
      }
    }

    window.sendHeartToUser = async () => {
      const targetUid = window.currentViewingUid;
      if (!targetUid) return;
      const targetRef = doc(db, "users", targetUid);
      const snap = await getDoc(targetRef);
      if (snap.exists()) {
        const currentH = snap.data().hearts || 0;
        const newH = currentH + 1;
        await updateDoc(targetRef, { hearts: newH });
        document.getElementById('modal-hearts-count').innerText = newH;
        alert("❤️ Đã thả tim thành công cho thành viên này!");
      }
    };

    window.sendFriendRequest = () => {
      alert("✅ Đã gửi lời mời kết bạn thành công!");
      closeModal();
    };

    window.reportUserModal = async () => {
      const reason = prompt("Nhập lý do báo cáo vi phạm:");
      if (!reason) return;
      const targetUid = window.currentViewingUid;
      try {
        const targetRef = doc(db, "users", targetUid);
        const tSnap = await getDoc(targetRef);
        if (tSnap.exists()) {
          const currentRep = tSnap.data().reportsCount || 0;
          if (currentRep >= 1) {
            await updateDoc(targetRef, { restricted: true, reportsCount: currentRep + 1 });
            alert("🚨 Hệ thống đã ghi nhận và hạn chế tài khoản này do có nhiều báo cáo từ cộng đồng!");
          } else {
            await updateDoc(targetRef, { reportsCount: currentRep + 1 });
            alert("⚠️ Đã gửi báo cáo thành công.");
          }
        }
      } catch (err) {
        alert("Lỗi báo cáo: " + err.message);
      }
      closeModal();
    };

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
  
  <!-- PeerJS cho Voice Call Discord Style -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="h-[100dvh] flex flex-col select-none">

  <!-- ================= AUTH SCREEN ================= -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#07090e] p-4">
    <div class="glass-panel p-8 rounded-3xl w-full max-w-md shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-blue-500/20 mb-3">
          <i class="fa-solid fa-mountain-sun"></i>
        </div>
        <h1 class="text-3xl font-black tracking-wider text-white">3 MIỀN</h1>
        <p class="text-xs text-slate-400 mt-1">Trò Chuyện, Voice Call Đỉnh Cao & Bảo Mật Cao Cấp</p>
      </div>

      <div id="auth-error" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3 rounded-xl text-xs mb-4"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Email (@gmail.com)</label>
          <input type="email" id="auth-email" required class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="name@gmail.com">
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Mật khẩu bảo mật</label>
          <input type="password" id="auth-password" required class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
        </div>
        
        <div class="flex gap-3 pt-2">
          <button onclick="loginUser()" class="flex-1 bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/20">
            Đăng Nhập
          </button>
          <button onclick="registerUser()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-sm transition">
            Đăng Ký
          </button>
        </div>

        <div id="resend-box" class="hidden text-center pt-2">
          <button onclick="resendVerificationEmail()" class="text-xs text-blue-400 hover:underline">🔄 Gửi lại mã xác thực (Resend Verification)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= GIAO DIỆN CHÍNH ================= -->
  <div id="app-screen" class="hidden flex-1 flex h-full overflow-hidden relative">
    
    <button onclick="toggleSidebar()" class="md:hidden absolute top-3 left-3 z-30 bg-slate-800 text-white p-2 rounded-xl text-xs shadow">
      <i class="fa-solid fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <div id="sidebar" class="absolute md:relative inset-y-0 left-0 z-20 w-72 bg-[#0b0f19] border-r border-slate-800/80 flex flex-col justify-between transform -translate-x-full md:translate-x-0 transition duration-300 shadow-2xl md:shadow-none">
      <div>
        <div class="p-4 border-b border-slate-800/80 flex items-center justify-between">
          <span class="font-black text-sm tracking-widest text-blue-400 flex items-center gap-2">
            <i class="fa-solid fa-mountain-sun"></i> 3 MIỀN CHAT
          </span>
          <button onclick="createNewPrivateGroup()" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-2.5 py-1 rounded-lg text-xs font-bold transition">
            + Tạo Nhóm
          </button>
        </div>

        <div class="p-3 space-y-1.5 overflow-y-auto max-h-[calc(100vh-230px)]">
          <div class="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Khu vực Miền (Public)</div>
          <button onclick="switchRoom('mien-bac-chung', '# 🏔️ Miền Bắc - Sảnh Chung')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center gap-2">
            <i class="fa-solid fa-snowflake text-cyan-400"></i> Miền Bắc
          </button>
          <button onclick="switchRoom('mien-trung-chung', '# 🏖️ Miền Trung - Sảnh Chung')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center gap-2">
            <i class="fa-solid fa-sun text-amber-400"></i> Miền Trung
          </button>
          <button onclick="switchRoom('mien-nam-chung', '# 🌴 Miền Nam - Sảnh Chung')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center gap-2">
            <i class="fa-solid fa-water text-emerald-400"></i> Miền Nam
          </button>

          <div class="pt-3 text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Nhóm Riêng Tư & AI Bot</div>
          <button onclick="switchRoom('nhom-ai-tro-ly', '# 🤖 Phòng Riêng: Trò Chuyện Cùng AI')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-blue-400 hover:bg-slate-800/60 transition flex items-center gap-2">
            <i class="fa-solid fa-robot"></i> Trò chuyện cùng AI Bot (@ai)
          </button>
          <div id="custom-groups-list" class="space-y-1"></div>
        </div>
      </div>

      <!-- Cụm Voice/Call Discord Style (Sát đáy cạnh cùng phía trên User Info) -->
      <div class="p-3 border-t border-slate-800/80 bg-[#07090e] space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Voice Call (Discord Style)
          </span>
          <span id="my-peer-id-badge" class="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded cursor-pointer hover:bg-slate-700" onclick="copyMyID()" title="Bấm copy ID">Copy ID</span>
        </div>
        
        <!-- Thanh điều khiển âm thanh & lọc âm -->
        <div class="flex items-center gap-2 text-[10px] text-slate-400 bg-[#0b0f19] px-2 py-1 rounded-lg border border-slate-800">
          <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="noise-suppression" checked class="accent-emerald-500"> Lọc âm / Khử ồn</label>
          <div class="flex items-center gap-1 ml-auto">
            <span>Vol:</span>
            <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="1" class="w-16 accent-emerald-500" onchange="adjustVolume(this.value)">
          </div>
        </div>

        <div class="flex gap-1">
          <input type="text" id="target-peer-input" placeholder="Dán ID bạn bè..." class="flex-1 bg-[#0b0f19] border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
          <button onclick="callPeer()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">Gọi</button>
          <button onclick="hangUpCall()" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-2 py-1.5 rounded-lg text-xs transition" title="Ngắt kết nối"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
      </div>

      <!-- User Profile Bar Sát Đáy -->
      <div class="p-3 border-t border-slate-800/80 flex items-center justify-between bg-[#05070a]">
        <div onclick="openProfileModal(currentUser.uid, myAnonTag)" class="flex items-center gap-2 overflow-hidden cursor-pointer">
          <div id="my-avatar-box" class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-xs text-white shadow overflow-hidden">3M</div>
          <div class="truncate">
            <div id="my-display-name-tag" class="text-xs font-bold text-slate-200 truncate">User#0000</div>
            <div class="text-[9px] text-slate-500">Bấm để sửa profile</div>
          </div>
        </div>
        <button onclick="logoutUser()" class="text-slate-500 hover:text-rose-400 text-xs p-2 transition" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>

    <!-- Main Chat Workspace -->
    <div class="flex-1 flex flex-col bg-[#07090e] h-full overflow-hidden">
      <div class="h-14 border-b border-slate-800/80 px-4 md:px-6 flex items-center justify-between bg-[#0b0f19]/60 backdrop-blur flex-shrink-0">
        <h2 id="room-title" class="font-bold text-sm text-white pl-8 md:pl-0"># 🏔️ Miền Bắc - Sảnh Chung</h2>
        <button onclick="sharePrivateInvite()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold text-slate-300 transition flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-shield-halved"></i> Chia sẻ phòng
        </button>
      </div>

      <div id="messages-container" class="flex-1 chat-messages-scroll p-4 md:p-6 space-y-3"></div>

      <!-- Chat Input Form -->
      <div class="p-3 md:p-4 bg-[#0b0f19] border-t border-slate-800/80 flex-shrink-0">
        <form id="chat-form" class="bg-[#07090e] border border-slate-800 rounded-2xl px-4 py-2.5 flex items-center gap-3 shadow-inner">
          <input type="text" id="chat-input" autocomplete="off" placeholder="Nhập tin nhắn bảo mật hoặc gõ @ai [nội dung]..." class="flex-1 bg-transparent text-sm text-white focus:outline-none">

          <button type="button" onclick="insertEmoji('🔥')" class="text-sm hover:scale-110 transition">🔥</button>
          <button type="button" onclick="insertEmoji('😂')" class="text-sm hover:scale-110 transition">😂</button>
          <button type="button" onclick="insertEmoji('👍')" class="text-sm hover:scale-110 transition">👍</button>

          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-blue-600/20 flex items-center gap-1.5">
            <span>Gửi</span> <i class="fa-solid fa-paper-plane text-[10px]"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= MODAL PROFILE & TIM & ĐẶC QUYỀN ================= -->
  <div id="profile-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="glass-panel p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 mx-auto flex items-center justify-center text-white text-xl font-black shadow-lg mb-3 overflow-hidden">3M</div>
      <h3 id="modal-username" class="text-lg font-bold text-white">User#0000</h3>
      <p class="text-[10px] text-slate-400 mt-1">Ngày tạo: <span id="modal-created-date" class="text-blue-400 font-semibold">--/--/----</span></p>
      
      <!-- Thống kê tim -->
      <div class="my-3 py-2 bg-[#07090e] rounded-xl border border-slate-800 flex justify-around items-center text-xs">
        <div><span id="modal-hearts-count" class="font-black text-rose-500 text-base">0</span> ❤️ Tim</div>
      </div>

      <!-- Phần chỉnh sửa dành riêng cho bản thân -->
      <div id="self-edit-section" class="hidden space-y-3 text-left mt-4 border-t border-slate-800 pt-3">
        <h4 class="text-xs font-bold text-blue-400 uppercase">Chỉnh sửa hồ sơ cá nhân</h4>
        <div>
          <label class="block text-[10px] text-slate-400 mb-1">Tên hiển thị mới:</label>
          <input type="text" id="edit-display-name" class="w-full bg-[#07090e] border border-slate-800 rounded-lg px-3 py-2 text-xs text-white" placeholder="Nhập tên hiển thị...">
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 mb-1">Link Avatar (URL hình ảnh):</label>
          <input type="text" id="edit-avatar-url" class="w-full bg-[#07090e] border border-slate-800 rounded-lg px-3 py-2 text-xs text-white" placeholder="https://...">
        </div>
        <button onclick="saveMyProfile()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition">Lưu Thay Đổi</button>
      </div>

      <!-- Phần tương tác cho người khác xem profile -->
      <div id="other-action-section" class="hidden mt-6 space-y-2.5">
        <button onclick="sendHeartToUser()" class="w-full bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 text-rose-400 font-bold py-2.5 rounded-xl text-xs transition">
          ❤️ Thả Tim Tăng Tương Tác
        </button>
        <button onclick="sendFriendRequest()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
          <i class="fa-solid fa-user-plus"></i> Kết bạn
        </button>
        <button onclick="reportUserModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition">
          <i class="fa-solid fa-triangle-exclamation"></i> Báo cáo vi phạm
        </button>
      </div>
    </div>
  </div>

  <!-- Audio element phát voice call -->
  <audio id="remote-audio" autoplay></audio>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    }
    function insertEmoji(em) {
      const inp = document.getElementById('chat-input');
      inp.value += em;
      inp.focus();
    }
    function createNewPrivateGroup() {
      const name = prompt("Nhập tên nhóm riêng tư muốn tạo:");
      if (!name) return;
      const cleanName = "nhom-" + name.toLowerCase().replace(/\s+/g, '-') + "-" + Math.floor(Math.random() * 1000);
      
      const list = document.getElementById('custom-groups-list');
      const btn = document.createElement('button');
      btn.className = "w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition flex items-center justify-between";
      btn.innerHTML = `<span onclick="switchRoom('${cleanName}', '# 🔒 Nhóm: ${name}')"># ${name}</span> <span class="text-[9px] text-emerald-400">Riêng tư</span>`;
      list.appendChild(btn);
      switchRoom(cleanName, '# 🔒 Nhóm: ' + name);
    }
    function sharePrivateInvite() {
      navigator.clipboard.writeText(window.location.href);
      alert("Đã sao chép liên kết phòng thành công!");
    }

    // Xử lý PeerJS Voice Call kiểu Discord (Lọc âm, xử lý MediaStream)
    let peer = new Peer();
    let myPeerID = "";
    let activeCall = null;
    let localStream = null;

    peer.on('open', (id) => {
      myPeerID = id;
      const badge = document.getElementById('my-peer-id-badge');
      if(badge) badge.innerText = "ID: " + id.substring(0, 4) + "...";
    });

    peer.on('call', async (call) => {
      if (confirm("📞 Có cuộc gọi thoại riêng tư đến! Chấp nhận kết nối?")) {
        try {
          const noiseOn = document.getElementById('noise-suppression').checked;
          localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: noiseOn, noiseSuppression: noiseOn } });
          call.answer(localStream);
          activeCall = call;
          call.on('stream', (remoteStream) => {
            const audio = document.getElementById('remote-audio');
            audio.srcObject = remoteStream;
            audio.play();
          });
        } catch(e) {
          alert("Không thể truy cập Micro thiết bị!");
        }
      }
    });

    async function callPeer() {
      const tid = document.getElementById('target-peer-input').value.trim();
      if (!tid) return alert("Vui lòng dán ID của bạn bè để gọi!");

      try {
        const noiseOn = document.getElementById('noise-suppression').checked;
        localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: noiseOn, noiseSuppression: noiseOn } });
        const call = peer.call(tid, localStream);
        activeCall = call;
        call.on('stream', (remoteStream) => {
          const audio = document.getElementById('remote-audio');
          audio.srcObject = remoteStream;
          audio.play();
        });
        alert("Đang kết nối cuộc gọi thoại riêng tư...");
      } catch(e) {
        alert("Không thể truy cập Micro để gọi!");
      }
    }

    function hangUpCall() {
      if (activeCall) {
        activeCall.close();
        activeCall = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      alert("📴 Đã ngắt cuộc gọi thoại.");
    }

    function adjustVolume(val) {
      const audio = document.getElementById('remote-audio');
      audio.volume = val;
    }

    function copyMyID() {
      if(!myPeerID) return;
      navigator.clipboard.writeText(myPeerID);
      alert("Đã sao chép ID thoại của bạn: " + myPeerID);
    }
  </script>
</body>
</html>
